{who:'Daniel',en:"How sustainable is the AI-driven demand, in your view?",zh:"你認為 AI 帶動的需求有多大的可持續性？",o:[["We think it's structural rather than cyclical, although we'd expect some quarter-to-quarter volatility.",1,'',"我們認為這是結構性而非循環性的，不過預期每季之間會有些波動。"],["AI is forever. Buy our stock.",0,"Please don't give investment advice on the call.","AI 是永恆的，買我們的股票。"],["I think it's a bubble, honestly.",0,"Your CEO just choked on his coffee.","老實說我覺得是泡沫。"]],why:"structural vs. cyclical（結構性 vs. 循環性）是法說會關鍵詞。although… 加入保留（hedging）。",sk:'listen'},
{who:'Daniel',en:"Last one: what keeps you up at night?",zh:"最後一題：什麼事讓你睡不著？",o:[["Honestly, talent. Finding enough experienced engineers is our biggest constraint, so we're investing heavily in training.",1,'',"老實說，是人才。找到足夠有經驗的工程師是我們最大的限制，所以我們大力投資培訓。"],["My neighbor's dog.",0,"Ha, but that's not what I meant.","我鄰居的狗。"],["Nothing. Everything is perfect.",0,"Nobody believes that on an earnings call.","沒有，一切都很完美。"]],why:"What keeps you up at night? = 你最擔心什麼。坦承一個風險＋說明對策，反而更有可信度。",sk:'listen'}],
ch:{who:'Daniel',en:"Give us your outlook for next quarter in two or three sentences.",zh:"用兩三句話說明你們對下一季的展望。",task:'包含：一個不利因素、一個成長動能、委婉保留語氣（expect / although / subject to）。',rules:[['headwind|currency|cost|challenge|pressure','不利因素',20],['demand|order|backlog|ai|growth','成長動能',20],['expect|anticipate|outlook|going forward','展望用語',20],['although|while|however|subject to|remain','保留語氣',20],['\\d|percent|quarter|guidance','具體或財測用語',20]],sample:"Going forward, we expect revenue to grow in the mid-single digits, supported by strong AI-related orders. Although currency remains a headwind, we're reaffirming our full-year guidance.",sampleZh:"往後我們預期營收中個位數成長，受 AI 相關訂單強勁支撐。雖然匯率仍是不利因素，我們重申全年財測。"}},

{line:'work',lv:'C1',bg:'bg_tradeshow',title:'C1 工作：向投資人募資簡報',story:'你在新加坡的創投路演，台下是天使投資人 Olivia。你只有三分鐘說服她投資你的 AI 檢測新創。',
cards:[["pain point","n.","痛點","Our product solves a real pain point.","我們的產品解決真正的痛點。"],["scalable","adj.","可擴展的、可規模化的","Our model is highly scalable.","我們的模式高度可規模化。"],["traction","n.","（新創）市場牽引力、實際成果","We've gained traction with ten paying clients.","我們已經有十個付費客戶，有實際成果。"],["burn rate","n.","燒錢速度","Our monthly burn rate is eighty thousand dollars.","我們每月燒錢 8 萬美元。"],["runway","n.","（資金）可撐的時間","This round gives us eighteen months of runway.","這輪募資讓我們能撐十八個月。"]],
qs:[{who:'Olivia',en:"You have three minutes. What problem are you solving?",zh:"你有三分鐘。你們在解決什麼問題？",o:[["Factories lose billions to defects that human inspectors miss. That's the pain point we solve with AI vision.",1,'',"工廠因為人工檢查員漏掉的瑕疵損失數十億。這就是我們用 AI 視覺解決的痛點。"],["We make cool AI stuff.",0,"\"Cool\" doesn't get funded.","我們做很酷的 AI 東西。"],["Let me start from 1998, when I was born…",0,"You've got three minutes, not three hours.","讓我從 1998 年我出生講起……"]],why:"Pitch 第一句：用具體損失帶出痛點（pain point），再一句說明解法。",sk:'speak'},
{who:'Olivia',en:"Lots of startups say that. Do you have any traction?",zh:"很多新創都這麼說。你們有實際成果嗎？",o:[["Yes. We have twelve paying customers, and revenue has tripled over the past year.",1,'',"有。我們有十二家付費客戶，營收過去一年成長了三倍。"],["Traction? Like car tires?",0,"Traction in startups means real customers or growth.","牽引力？像輪胎那樣？"],["Not yet, but everyone loves the idea.",0,"Love doesn't pay the bills.","還沒有，但大家都愛這個點子。"]],why:"traction = 實際市場成果（客戶、營收成長）。投資人要的是數字。",sk:'listen'},
{who:'Olivia',en:"Why can't a big player like Siemens just copy you?",zh:"像西門子這樣的大公司為什麼不直接抄你們？",o:[["They could try, but our edge is the data. We've trained on twenty million defect images that they simply don't have.",1,'',"他們可以試，但我們的優勢是數據。我們用兩千萬張瑕疵影像訓練，這是他們沒有的。"],["They are too slow and stupid.",0,"Underestimating incumbents is a red flag.","他們太慢又太笨。"],["Please don't tell them about us.",0,"Ha, I'm afraid they already know.","請不要告訴他們我們的事。"]],why:"說明護城河（edge / moat）：具體、可驗證、難複製。They could try, but… 先承認再反駁。",sk:'speak'},
{who:'Olivia',en:"What's your burn rate, and how much runway do you have?",zh:"你們的燒錢速度多少？還能撐多久？",o:[["We burn about eighty thousand a month. With this round, we'd have roughly eighteen months of runway.",1,'',"我們每月燒約八萬。有了這輪資金，大約能撐十八個月。"],["We burn nothing. We use electricity.",0,"Burn rate means how fast you spend cash!","我們不燒東西，我們用電。"],["Runway? We don't have an airport.",0,"Runway means how long your money lasts.","跑道？我們沒有機場。"]],why:"burn rate = 每月淨花費；runway = 資金可撐的月數。投資人一定會問。",sk:'listen'},
{who:'Olivia',en:"Okay. What exactly are you asking for?",zh:"好。你具體要多少？",o:[["We're raising two million dollars to scale into Vietnam and Thailand, where demand is growing fastest.",1,'',"我們募資兩百萬美元，用來擴展到越南和泰國，那裡需求成長最快。"],["Whatever you can give. Please.",0,"Never sound desperate in a pitch.","你能給多少就多少。拜託。"],["One billion. Is that okay?",0,"Bold. Not realistic, but bold.","十億。可以嗎？"]],why:"The ask：金額＋用途＋為什麼是現在／那裡。",sk:'speak'}],
ch:{who:'Olivia',en:"Give me your thirty-second elevator pitch.",zh:"給我你的三十秒電梯簡報。",task:'包含：痛點、解法、成果（數字）、募資金額與用途。',rules:[['defect|lose|problem|pain','痛點',20],['ai|vision|solution|solve','解法',20],['customer|client|revenue|tripl|grow','實際成果',20],['raising|million|invest|round','募資金額',20],['scale|expand|market|vietnam|thailand','用途',20]],sample:"Factories lose billions to defects humans miss. Our AI vision system catches them in real time. We already have twelve paying customers and tripled revenue last year. We're raising two million dollars to expand into Southeast Asia.",sampleZh:"工廠因人眼漏掉的瑕疵損失數十億。我們的 AI 視覺系統即時抓出瑕疵。我們已有十二家付費客戶，去年營收成長三倍。現在募資兩百萬美元擴展東南亞。"}},

{line:'work',lv:'C1',bg:'bg_bar',title:'C1 工作：和外國高層的跨文化閒聊',story:'商務晚宴上你坐在美國母公司的 COO Catherine 旁邊。她很友善，但每句話都在評估你。這場閒聊可能影響你的升遷。',
cards:[["break the ice","phr.","打破僵局、破冰","A good question can break the ice.","一個好問題能破冰。"],["touch base","phr.","聯繫一下、碰個頭","Let's touch base next week.","我們下週聯繫一下。"],["hit it off","phr.","一見如故、很合得來","We really hit it off.","我們真的很合得來。"],["if you don't mind me asking","phr.","如果你不介意我問的話","If you don't mind me asking, how did you start?","如果不介意我問，你是怎麼起步的？"],["I couldn't agree more","phr.","我完全同意","I couldn't agree more.","我完全同意。"]],
qs:[{who:'Catherine',en:"So, Henry, is this your first time at one of these dinners?",zh:"Henry，這是你第一次參加這種晚宴嗎？",o:[["It is, actually. I'm trying to look more relaxed than I feel!",1,'',"其實是的。我正努力看起來比實際上輕鬆！"],["Yes. I am very nervous. Very very nervous.",0,"Oh dear, now I'm nervous too.","是的。我很緊張，非常非常緊張。"],["No. I go to dinners every night.",0,"Well, that's… a lot of dinners.","不是，我每晚都去晚宴。"]],why:"一點自嘲幽默（self-deprecating humor）是很好的破冰方式，但不要過度。",sk:'speak'},
{who:'Catherine',en:"I hear Taiwan's food scene is incredible. Any recommendations?",zh:"聽說台灣的美食很厲害。有推薦嗎？",o:[["You can't go wrong with the night markets, but if you'd like something special, I'd be happy to recommend a place for beef noodles.",1,'',"夜市絕對不會錯，但如果你想吃特別的，我很樂意推薦一家牛肉麵。"],["Stinky tofu. You must eat ten.",0,"Ten? Let's start with one.","臭豆腐。你一定要吃十塊。"],["McDonald's is good.",0,"I can get that in Chicago, Henry.","麥當勞不錯。"]],why:"You can't go wrong with… = …一定不會錯。I'd be happy to… 主動提供幫助。",sk:'speak'},
{who:'Catherine',en:"Honestly, the hardest part of my job is making decisions with incomplete information.",zh:"老實說，我工作最難的部分是在資訊不完整時做決定。",o:[["I couldn't agree more. If you don't mind me asking, how do you decide when you have enough data?",1,'',"我完全同意。如果不介意我問，你怎麼判斷資料已經足夠？"],["Information is easy. Just Google it.",0,"If only it were that simple.","資訊很簡單，Google 就好。"],["Yes. I also make many bad decisions.",0,"Not the best thing to say to a COO.","對，我也做了很多爛決定。"]],why:"高層閒聊要「有深度地接話」：同意＋用 If you don't mind me asking 提出好問題，讓對方多談。",sk:'speak'},
{who:'Catherine',en:"Usually when waiting longer costs more than being wrong. What about you, how do you handle tough clients?",zh:"通常是當等待的代價大於犯錯的代價時。那你呢，怎麼應付難搞的客戶？",o:[["I try to figure out what's really behind the pushback. Nine times out of ten, it's a concern they haven't said out loud.",1,'',"我會試著找出對方抗拒背後的真正原因。十之八九，是他們沒說出口的顧慮。"],["I tell them to calm down.",0,"Hmm, how does that usually go?","我叫他們冷靜。"],["I give them a big discount.",0,"That's expensive diplomacy.","我給他們大折扣。"]],why:"nine times out of ten = 十之八九；pushback = 反對、抗拒。用經驗說明自己的做法。",sk:'speak'},
{who:'Catherine',en:"I've really enjoyed this. Let's stay in touch.",zh:"我很享受這次聊天。我們保持聯絡。",o:[["Likewise. I'll touch base next week about the Southeast Asia plan, if that works for you.",1,'',"我也是。如果你方便，我下週再跟你聯繫東南亞計畫。"],["Can you give me a promotion now?",0,"Way too soon, Henry.","你現在可以幫我升職嗎？"],["Okay, I'll text you every day.",0,"Maybe not every day…","好，我每天傳訊息給你。"]],why:"Likewise = 我也是。touch base = 聯繫一下。給一個具體但不越界的後續。",sk:'speak'}],
ch:{who:'Catherine',en:"Tell me a bit about yourself outside of work.",zh:"跟我聊聊你工作以外的自己。",task:'分享一個興趣、為什麼喜歡、再反問對方，語氣自然輕鬆。',rules:[['boxing|gym|fitness|invest|tech|ufc|train','說出興趣',25],['because|helps|keeps|love','說原因',20],['what about you|how about you|do you','反問對方',25],['really|actually|honestly','自然語氣詞',15],['into|enjoy|passionate','喜好用語',15]],sample:"Honestly, I'm really into boxing. It keeps me sane after long days at work, and it's taught me a lot about staying calm under pressure. What about you? What do you do to switch off?",sampleZh:"老實說我很熱衷拳擊。長時間工作後它讓我保持理智，也教會我在壓力下保持冷靜。你呢？你怎麼放鬆？"}},

{line:'life',lv:'C1',bg:'bg_bar',title:'C1 生活：投資觀點大辯論',story:'朋友聚會上，做避險基金的 Ethan 堅持「現在全部押科技股」，而保守的 Sophie 說「應該全買債券」。他們都轉頭問你。',
cards:[["diversification","n.","分散投資","Diversification reduces your risk.","分散投資能降低風險。"],["risk appetite","n.","風險承受偏好","It depends on your risk appetite.","這取決於你的風險偏好。"],["time in the market","phr.","待在市場的時間（長期投資）","Time in the market beats timing the market.","長期待在市場勝過擇時進出。"],["devil's advocate","n.","故意唱反調的人","Let me play devil's advocate.","讓我來唱個反調。"],["valuation","n.","估值","Valuations look stretched right now.","目前估值看起來偏高。"]],
qs:[{who:'Ethan',en:"Tech is the future. Anyone not all-in on tech is leaving money on the table.",zh:"科技是未來。沒有全押科技股的人都在錯失賺錢機會。",o:[["I see where you're coming from, but putting everything in one sector seems risky, especially at current valuations.",1,'',"我理解你的出發點，但把全部放在單一產業似乎很冒險，尤其以目前的估值來看。"],["Yes! I will sell my house and buy tech!",0,"Whoa, slow down there.","對！我要賣房子買科技股！"],["Tech is a bubble. You are crazy.",0,"Attacking the person isn't a counterargument.","科技是泡沫，你瘋了。"]],why:"I see where you're coming from, but… 是 C1 級的禮貌反駁。leave money on the table = 錯失可得的利益。",sk:'speak'},
{who:'Sophie',en:"Exactly! That's why I keep everything in bonds. Zero stress.",zh:"沒錯！所以我全放債券，零壓力。",o:[["That's safe, but with inflation, you might actually be losing purchasing power over time.",1,'',"那很安全，但考慮通膨，長期下來你可能其實在損失購買力。"],["Bonds? Like James Bond?",0,"Ha, not quite.","債券？像詹姆士龐德？"],["Zero stress, zero money.",0,"A bit harsh, don't you think?","零壓力，零收益。"]],why:"兩邊都指出盲點才是成熟的辯論。purchasing power = 購買力；might actually 加上保留。",sk:'speak'},
{who:'Ethan',en:"So what would you do with, say, a million dollars?",zh:"那如果你有，比方說，一百萬美元，你會怎麼做？",o:[["It really depends on your risk appetite, but personally, I'd go for a diversified mix, maybe seventy percent global stocks and thirty percent bonds.",1,'',"這真的取決於風險偏好，但我個人會選擇分散組合，也許 70% 全球股票、30% 債券。"],["Buy a Lamborghini.",0,"That's a depreciating asset, my friend.","買一台藍寶堅尼。"],["Give it to you, Ethan. You're the expert.",0,"Flattering, but no.","給你，Ethan。你是專家。"]],why:"It depends on… but personally… 先說原則再給個人看法，避免說成投資建議。",sk:'speak'},
{who:'Sophie',en:"But what if the market crashes next month?",zh:"但如果下個月股市崩盤呢？",o:[["Nobody can time the market. Historically, time in the market has mattered more than timing it.",1,'',"沒人能預測市場時機。歷史上，待在市場的時間比擇時進出更重要。"],["Then we all cry together.",0,"Very comforting, thanks.","那我們一起哭。"],["It won't crash. I promise.",0,"You can't promise that.","不會崩盤，我保證。"]],why:"Time in the market beats timing the market 是常見投資格言。Historically 讓論點有依據。",sk:'listen'},
{who:'Ethan',en:"Come on, play devil's advocate. What's the best argument against your own view?",zh:"來嘛，唱個反調。反對你自己觀點最有力的論點是什麼？",o:[["Fair enough. Diversification can mean underperforming in a strong bull market, so you'll never beat the best investors.",1,'',"好吧。分散投資可能在強勁多頭時表現落後，所以你永遠贏不了最頂尖的投資人。"],["There is no argument. I'm always right.",0,"That's exactly what a bad investor would say.","沒有反論。我永遠是對的。"],["Devil? I don't believe in devils.",0,"It's just an expression!","惡魔？我不相信有惡魔。"]],why:"play devil's advocate = 故意唱反調。能說出自己論點的弱點，是 C1 思辨能力的展現。",sk:'speak'}],
ch:{who:'Sophie',en:"Okay, sum up your view so both of us feel heard.",zh:"好，總結你的觀點，讓我們兩個都覺得被理解。",task:'各肯定雙方一點，再提出你的折衷觀點，並用委婉語氣。',rules:[['ethan|tech|growth','肯定科技派',20],['sophie|bond|safe','肯定保守派',20],['diversif|mix|balance','折衷觀點',25],['depends|personally|might|i think|i\'d','委婉語氣',20],['but|however|while','轉折',15]],sample:"Ethan's right that tech has huge growth potential, and Sophie's right that safety matters. Personally, I think a diversified mix is the best balance, but it really depends on your risk appetite.",sampleZh:"Ethan 說得對，科技成長潛力巨大；Sophie 也對，安全很重要。我個人認為分散組合是最好的平衡，但真的取決於個人的風險偏好。"}},

{line:'life',lv:'C1',bg:'bg_boxing',title:'C1 生活：拳館裡的教練會談',story:'你想報名業餘拳擊賽。總教練 Coach Ray 是退役職業選手，他會老實告訴你夠不夠格。',
cards:[["be on the fence","phr.","猶豫不決","I'm still on the fence about competing.","我對參賽還在猶豫。"],["bite off more than you can chew","idiom","不自量力","Don't bite off more than you can chew.","別不自量力。"],["the bottom line is","phr.","重點是、說到底","The bottom line is you need more sparring.","重點是你需要更多實戰。"],["hold your own","phr.","撐得住、不落下風","You can hold your own against him.","你跟他打不會落下風。"],["take it up a notch","phr.","提升一個檔次","It's time to take it up a notch.","該提升一個檔次了。"]],
qs:[{who:'Coach Ray',en:"So you want to compete. What's holding you back?",zh:"所以你想參賽。是什麼讓你遲疑？",o:[["To be honest, I'm on the fence. I'm worried I might be biting off more than I can chew.",1,'',"老實說我還在猶豫。我擔心自己可能不自量力。"],["Nothing holds me. I am free.",0,"I meant what's stopping you, philosopher.","沒有東西抓著我。我是自由的。"],["My fence is broken.",0,"\"On the fence\" means undecided, haha.","我的圍籬壞了。"]],why:"be on the fence = 猶豫不決；bite off more than you can chew = 不自量力。兩個常用 idiom。",sk:'speak'},
{who:'Coach Ray',en:"Your technique's decent, but your defense falls apart when you get tired.",zh:"你的技術還行，但累了防守就崩潰。",o:[["That's fair. So would you say conditioning is the main thing I need to work on?",1,'',"說得對。所以你會說體能是我最需要加強的嗎？"],["My defense is perfect. You need glasses.",0,"Say that after you get hit.","我的防守很完美，你需要眼鏡。"],["Falls apart? Like LEGO?",0,"It means it stops working.","崩潰？像樂高那樣？"]],why:"fall apart = 崩潰、瓦解。would you say…? 是婉轉確認重點的問法。",sk:'listen'},
{who:'Coach Ray',en:"The bottom line is, you need eight weeks of hard sparring before I'd let you fight.",zh:"說到底，你需要八週的高強度實戰，我才會讓你上場。",o:[["Eight weeks sounds tough, but realistic. I'd rather be properly prepared than rush it.",1,'',"八週聽起來很辛苦，但很實際。我寧願準備充分也不要倉促上場。"],["Eight weeks? I want to fight tomorrow!",0,"And get knocked out by Friday.","八週？我明天就要打！"],["Bottom line? Which line is the bottom?",0,"It means 'the most important point'.","最底下的線？哪條是最底下？"]],why:"I'd rather A than B = 寧願 A 也不要 B，C1 常用比較句型。",sk:'speak'},
{who:'Coach Ray',en:"You'd probably be matched with someone with two or three fights. Think you can hold your own?",zh:"你可能會配到打過兩三場的對手。你覺得撐得住嗎？",o:[["If I put in the work, I think I can hold my own. I'm not expecting an easy fight, though.",1,'',"如果我下足功夫，我想我撐得住。不過我不期待會是輕鬆的比賽。"],["Hold my own what?",0,"Hold your own means compete without being dominated.","握住我自己的什麼？"],["I will destroy him in ten seconds.",0,"Confidence is great. Delusion isn't.","我十秒就把他打爆。"]],why:"hold your own = 不落下風。though 放句尾表示「不過」，語氣自然。",sk:'speak'},
{who:'Coach Ray',en:"Alright. Starting Monday, we take it up a notch. Any questions?",zh:"好。從週一開始，我們提升一個檔次。有問題嗎？",o:[["Just one: how should I balance this with my full-time job so I don't burn out?",1,'',"只有一個：我該怎麼跟全職工作取得平衡，才不會燃燒殆盡？"],["What is a notch? Is it food?",0,"No, it's a level, a step up.","Notch 是什麼？是食物嗎？"],["No questions. I already know everything.",0,"Then you don't need a coach.","沒問題。我什麼都知道了。"]],why:"take it up a notch = 提升一個檔次；burn out = 過勞、燃燒殆盡。",sk:'listen'}],
ch:{who:'Coach Ray',en:"Convince me you're committed. Why should I put you in the fight?",zh:"說服我你是認真的。我為什麼要讓你上場？",task:'用至少一個 idiom，說明你的承諾、訓練計畫和自知之明。',rules:[['commit|serious|dedicated','表達承諾',20],['spar|train|condition|cardio|week','訓練計畫',25],['hold my own|on the fence|bite off|notch|bottom line','使用 idiom',25],['i know|realistic|not easy|weakness|defense','自知之明',15],['will|going to|promise','未來承諾',15]],sample:"I'm fully committed. I know my defense falls apart when I'm tired, so I'll do eight weeks of hard sparring and extra conditioning. I'm not expecting it to be easy, but I believe I can hold my own.",sampleZh:"我完全投入。我知道累了防守會崩，所以我會做八週高強度實戰和額外體能訓練。我不期待會很輕鬆，但相信自己撐得住。"}},

{line:'work',lv:'C1',bg:'bg_call',title:'C1 工作：危機溝通——產品召回',story:'一批出貨給美國客戶的感測器有瑕疵，可能需要召回。你要在視訊上向客戶 VP Laura 說明，每句話都可能被法務部引用。',
cards:[["to the best of our knowledge","phr.","據我們所知","To the best of our knowledge, no one was hurt.","據我們所知，沒有人受傷。"],["as a precaution","phr.","作為預防措施","As a precaution, we're recalling the batch.","作為預防措施，我們會召回這批貨。"],["we're not in a position to","phr.","我們目前無法…","We're not in a position to confirm that yet.","我們目前還無法確認。"],["root cause analysis","n.","根本原因分析","We'll share the root cause analysis by Friday.","我們週五前會分享根本原因分析。"],["full transparency","n.","完全透明","We're committed to full transparency.","我們承諾完全透明。"]],
qs:[{who:'Laura',en:"How many units are affected, and is anyone at risk?",zh:"有多少台受影響？有人有危險嗎？",o:[["To the best of our knowledge, about four hundred units, and there's no safety risk. The issue affects accuracy, not safety.",1,'',"據我們所知，大約四百台，沒有安全風險。問題影響的是準確度，不是安全。"],["Only a few. Don't worry about it.",0,"\"A few\" isn't a number, and I will worry.","只有幾台，別擔心。"],["Everyone is at risk! It's terrible!",0,"Panic doesn't help either of us.","每個人都有危險！太可怕了！"]],why:"危機溝通：To the best of our knowledge 精確但保留；把「影響範圍」講清楚。",sk:'speak'},
{who:'Laura',en:"Why didn't your quality control catch this?",zh:"為什麼你們的品管沒抓到？",o:[["That's a fair question, and we're not in a position to give a full answer yet. Our root cause analysis will be ready by Friday.",1,'',"這是合理的問題，我們目前還無法給出完整答案。根本原因分析週五前會完成。"],["Quality control was on holiday.",0,"Please tell me that's a joke.","品管在放假。"],["Your factory probably broke them.",0,"Blaming the client? Bold and terrible.","可能是你們工廠弄壞的。"]],why:"不確定時不要猜：we're not in a position to… yet，再給明確時程。",sk:'speak'},
{who:'Laura',en:"What are you doing right now to protect our production line?",zh:"你們現在採取什麼措施保護我們的產線？",o:[["As a precaution, we're shipping replacement sensors by air today, and our engineers will help swap them on site.",1,'',"作為預防措施，我們今天空運替換感測器，工程師也會到現場協助更換。"],["We are thinking about it.",0,"Thinking isn't acting.","我們正在考慮。"],["You can use them a little longer.",0,"Not without a written guarantee.","你們可以再用一陣子。"]],why:"as a precaution = 作為預防措施。具體行動＋時間點。",sk:'speak'},
{who:'Laura',en:"Our legal team will want everything in writing.",zh:"我們的法務部會要求所有內容都要書面化。",o:[["Absolutely. We're committed to full transparency, and I'll send a written summary within the hour.",1,'',"當然。我們承諾完全透明，我會在一小時內寄出書面摘要。"],["Legal team? Please, no lawyers.",0,"That sounds like you have something to hide.","法務？拜託不要找律師。"],["Writing is slow. Let's just talk.",0,"Talking won't protect either of us.","寫東西太慢，我們用說的就好。"]],why:"full transparency = 完全透明。within the hour = 一小時內。",sk:'speak'},
{who:'Laura',en:"I have to be honest. This has damaged our confidence in you.",zh:"老實說，這件事損害了我們對你們的信心。",o:[["I completely understand, and I won't pretend otherwise. We intend to earn that trust back through actions, not words.",1,'',"我完全理解，也不會假裝沒這回事。我們打算用行動而非言語贏回信任。"],["Don't be so dramatic.",0,"Wow. Okay.","別那麼誇張。"],["But we are a good company!",0,"Then prove it.","但我們是好公司！"]],why:"承認傷害＋承諾行動（earn trust back through actions, not words），C1 級的危機語言。",sk:'speak'}],
ch:{who:'Laura',en:"Give me a short statement I can share with my CEO.",zh:"給我一段可以轉給我們 CEO 的簡短聲明。",task:'正式語氣：影響範圍、預防措施、時程、透明承諾，避免過度承諾。',rules:[['unit|batch|\\d','影響範圍',20],['precaution|replace|ship|recall','預防措施',20],['friday|within|by|hour|day','時程',20],['transparen|written|update','透明承諾',20],['best of our knowledge|not in a position|currently|preliminary','精確保留語氣',20]],sample:"To the best of our knowledge, around four hundred units are affected, with no safety risk. As a precaution, we are replacing all sensors this week. We will share our root cause analysis by Friday and keep you updated with full transparency.",sampleZh:"據我們所知，約四百台受影響，無安全風險。作為預防措施，本週將更換所有感測器。我們週五前提供根本原因分析，並以完全透明的方式持續更新。"}},

{line:'life',lv:'C1',bg:'bg_restaurant',title:'C1 生活：晚餐桌上的觀點交鋒',story:'朋友 Hannah 家的晚餐。話題轉到「AI 會不會讓人失業」，大家意見分歧。你想表達觀點，又不想讓氣氛變僵。',
cards:[["play it by ear","idiom","見機行事","Let's play it by ear.","我們見機行事吧。"],["to some extent","phr.","在某種程度上","I agree to some extent.","我在某種程度上同意。"],["that's a slippery slope","phr.","那是滑坡謬誤／會一發不可收拾","Banning it is a slippery slope.","禁止它會一發不可收拾。"],["agree to disagree","phr.","求同存異、各自保留意見","Let's agree to disagree.","我們就各自保留意見吧。"],["the jury is still out","idiom","尚無定論","The jury is still out on that.","那件事尚無定論。"]],
qs:[{who:'Hannah',en:"AI is going to take all our jobs. It's terrifying.",zh:"AI 會搶走我們所有的工作，好可怕。",o:[["I agree to some extent. Some jobs will disappear, but history suggests new ones usually emerge too.",1,'',"我在某種程度上同意。有些工作會消失，但歷史顯示通常也會出現新工作。"],["Relax. You're overreacting.",0,"Telling someone to relax never helps.","放輕鬆，你反應過度了。"],["Yes, we are all finished.",0,"Cheerful dinner conversation…","對，我們都完了。"]],why:"to some extent = 某種程度上。部分同意＋用歷史當證據，是平衡的論述。",sk:'speak'},
{who:'Ben',en:"So should the government ban AI in some industries?",zh:"那政府應該在某些產業禁止 AI 嗎？",o:[["I'd be careful there. Banning it outright could be a slippery slope. Regulation might work better than a ban.",1,'',"這點我會謹慎。直接禁止可能會一發不可收拾，監管可能比禁止更有效。"],["Yes, ban everything!",0,"Including your phone?","對，全部禁止！"],["Government? I don't do politics.",0,"Fair, but you can still have an opinion.","政府？我不談政治。"]],why:"outright = 完全地；slippery slope = 一發不可收拾。用 might 委婉比較方案。",sk:'speak'},
{who:'Hannah',en:"But what about people who can't retrain? Like my uncle, he's fifty-eight.",zh:"但那些沒辦法再培訓的人呢？像我叔叔，他五十八歲了。",o:[["That's a really important point, and I don't think there's an easy answer. The jury is still out on how to support them.",1,'',"那是很重要的一點，我不認為有簡單答案。要怎麼幫助他們還沒有定論。"],["He should just learn to code.",0,"That sounds a bit dismissive.","他應該去學寫程式。"],["Fifty-eight is old. Retire.",0,"Ouch. Insensitive much?","五十八歲很老了，退休吧。"]],why:"承認對方論點的份量、不給廉價答案；the jury is still out = 尚無定論。",sk:'speak'},
{who:'Ben',en:"Henry, you work with AI. Aren't you biased?",zh:"Henry，你的工作跟 AI 有關，你不會有偏見嗎？",o:[["Fair enough, I probably am to some degree. That's why I try to look at the data rather than just my own experience.",1,'',"說得也是，我可能某種程度上有偏見。所以我盡量看數據，而不只是我自己的經驗。"],["No, I'm never biased.",0,"Everyone's a little biased.","不，我從不偏頗。"],["How dare you!",0,"Whoa, calm down. It was a fair question.","你好大的膽子！"]],why:"承認可能的偏見（I probably am to some degree）反而增加可信度。",sk:'speak'},
{who:'Hannah',en:"Well, I still think it's dangerous.",zh:"嗯，我還是覺得很危險。",o:[["That's fair. I guess we'll have to agree to disagree on that one. More wine, anyone?",1,'',"可以理解。我想這點我們就各自保留意見吧。有人要再來點酒嗎？"],["You're wrong, and I'll prove it.",0,"And there goes the dinner party.","你錯了，我會證明給你看。"],["Okay, you win. I'm wrong.",0,"You don't have to give up your view!","好，你贏了，我錯了。"]],why:"agree to disagree = 求同存異。再用輕鬆一句轉移話題，保住氣氛。",sk:'speak'}],
ch:{who:'Ben',en:"So, final answer: is AI good or bad for workers?",zh:"所以，最終答案：AI 對勞工是好是壞？",task:'給出細膩的觀點：承認兩面、使用保留語氣、至少一個 idiom 或 C1 片語。',rules:[['to some extent|to some degree|jury is still out|agree to disagree|slippery slope','C1 片語／idiom',25],['job|worker|retrain|skill','提到工作／技能',20],['but|however|on the other hand|while','兩面論述',20],['might|could|probably|likely|i think','保留語氣',20],['govern|regulat|support|company','提出責任方',15]],sample:"I think it's good to some extent, but not for everyone. AI will probably create new jobs, while some workers might struggle to retrain. The jury is still out, but governments and companies should support them.",sampleZh:"我認為在某種程度上是好的，但不是對每個人都好。AI 可能創造新工作，但有些勞工可能難以轉型。目前尚無定論，但政府和企業應該協助他們。"}},

{line:'work',lv:'C1',bg:'bg_tradeshow',title:'C1 工作：國際研討會專題演講',story:'你受邀在東京的智慧製造論壇上台演講 10 分鐘，還有現場 Q&A。台下有三百人，主持人 Dr. Sato 剛介紹完你。',
cards:[["without further ado","phr.","閒話少說、廢話不多說","Without further ado, let's begin.","廢話不多說，我們開始吧。"],["by and large","phr.","大體上、總的來說","By and large, the results were positive.","總的來說結果是正面的。"],["counterintuitive","adj.","違反直覺的","The result was counterintuitive.","結果違反直覺。"],["that's beyond the scope of","phr.","那超出了…的範圍","That's beyond the scope of today's talk.","那超出了今天演講的範圍。"],["to wrap up","phr.","總結一下、收尾","To wrap up, let me share three takeaways.","總結一下，分享三個重點。"]],
qs:[{who:'Dr. Sato',en:"Please welcome our next speaker, Henry Yeh.",zh:"讓我們歡迎下一位講者，Henry Yeh。",o:[["Thank you, Dr. Sato, and good afternoon, everyone. Without further ado, let me start with a question.",1,'',"謝謝 Sato 博士，大家午安。廢話不多說，我先問大家一個問題。"],["Hello. I am Henry. I am nervous. Okay, start.",0,"Shaky start, but okay.","哈囉，我是 Henry。我很緊張。好，開始。"],["Can everyone hear me? Hello? Hello?",0,"Yes, we can hear you. Please begin.","大家聽得到嗎？哈囉？哈囉？"]],why:"Without further ado = 廢話不多說。用問題開場能立刻抓住聽眾。",sk:'speak'},
{who:'Audience',en:"(Your slide says: \"More inspection, fewer defects?\")",zh:"（你的投影片寫著：「檢查越多，瑕疵越少？」）",o:[["Here's the counterintuitive part: in our data, adding more manual checks actually increased defects, because inspectors got fatigued.",1,'',"違反直覺的地方在於：在我們的數據中，增加人工檢查反而讓瑕疵變多，因為檢查員會疲勞。"],["More inspection is good. Next slide.",0,"That's not very insightful.","檢查越多越好。下一張。"],["I don't know why I wrote this.",0,"The audience is confused now.","我不知道我為什麼寫這個。"]],why:"counterintuitive = 違反直覺。演講中用意外的數據製造記憶點。",sk:'speak'},
{who:'Audience',en:"Q: How does your system perform on transparent materials, like glass?",zh:"問：你們的系統在玻璃這類透明材質上表現如何？",o:[["Great question. By and large, accuracy drops by a few points, so we use polarized lighting to compensate.",1,'',"好問題。大體上準確度會降幾個百分點，所以我們用偏光照明來補償。"],["Glass is easy. No problem.",0,"Engineers in the room know that's not true.","玻璃很簡單，沒問題。"],["Next question, please.",0,"Dodging a technical question looks bad.","請下一個問題。"]],why:"By and large = 大體上。誠實說明限制＋解法，專業聽眾最信服。",sk:'speak'},
{who:'Audience',en:"Q: What's your view on how AI regulation in the EU will affect Asian suppliers?",zh:"問：你怎麼看歐盟的 AI 法規會如何影響亞洲供應商？",o:[["That's a fascinating question, but it's somewhat beyond the scope of today's talk. I'd be happy to discuss it over coffee afterwards.",1,'',"很棒的問題，但有點超出今天演講的範圍。我很樂意會後喝咖啡時再聊。"],["The EU is too strict. Next.",0,"That might offend half the room.","歐盟太嚴了。下一題。"],["I have no idea about anything.",0,"Too much honesty, maybe.","我什麼都不知道。"]],why:"beyond the scope of… = 超出範圍。禮貌拒答並提供替代方案。",sk:'listen'},
{who:'Dr. Sato',en:"We have one minute left.",zh:"我們還剩一分鐘。",o:[["To wrap up: measure fatigue, not just defects; combine humans with AI; and start small. Thank you.",1,'',"總結一下：要量測疲勞，不只是瑕疵；人與 AI 結合；從小規模開始。謝謝大家。"],["Wait, I have twenty more slides.",0,"Dr. Sato looks worried.","等等，我還有二十張投影片。"],["Okay, bye.",0,"That was an abrupt ending.","好，掰。"]],why:"To wrap up 收尾，三點總結（rule of three）最好記。",sk:'speak'}],
ch:{who:'Dr. Sato',en:"Could you give a thirty-second summary for people who joined late?",zh:"可以為晚到的人做三十秒總結嗎？",task:'用演講語氣：開場語、一個反直覺發現、三點收尾。',rules:[['further ado|wrap up|in short|to sum up|by and large','演講用語',25],['counterintuitive|surprising|actually','反直覺發現',20],['fatigue|human|ai|defect','核心內容',20],['first|second|third|three','三點結構',20],['thank','致謝',15]],sample:"In short, our key finding was counterintuitive: more manual inspection actually increased defects because of fatigue. To wrap up, three takeaways: measure fatigue, combine humans with AI, and start small. Thank you.",sampleZh:"簡單說，我們的關鍵發現違反直覺：更多人工檢查反而因疲勞增加瑕疵。總結三個重點：量測疲勞、人與 AI 結合、從小規模開始。謝謝。"}}
);

chapterList=function(){const b=bests();const strip=t=>t.replace(/^(工作|生活) \d+：/,'').replace(/^(B2|C1) (工作|生活)：/,'');

 let opened=false;return ['B1','B2','C1'].map(lv=>{const idx=[];if(lv==='B1')CHN.forEach((n,i)=>idx.push(i));const W=[],L=[];X.forEach((c,j)=>{if(lvOf(j)!==lv)return;idx.push(XB+j);(c.line==='work'?W:L).push(it(XB+j,strip(c.title),lv))});

 const cnt=lv=>VOCAB.filter(v=>CEFR[v[6]]===lv).length;const grp=(lv,srcs,open)=>`<details class="lvgrp" ${open?'open':''}><summary><span class="lvt lv${lv}">${lv}</span> ${cnt(lv)} 字</summary>${srcs.map(s=>`<h4>${SRCN[s]}</h4><div class="lvg">${sec(s)}</div>`).join('')}</details>`;

const DIST7={"0.0": ["I'm coming for a business trip, to meet with my client there.", 0, "\"Coming for\"? You're already here. Say \"I'm here on a business trip.\"", "我是為了出差而來，要和那邊的客戶見面。（come for 搭配不自然）"], "0.1": ["I will stay here during five days and flying back on Friday.", 0, "\"During five days\"? Use \"for five days.\"", "我會在這裡待五天，週五飛回去。（during 用錯、時態混亂）"], "0.2": ["No problem. Could you say me which gate it is leaving from, please?", 0, "\"Say me\"? You mean \"tell me.\"", "沒問題。可以「說我」它從哪個登機門出發嗎？（say me 搭配錯誤）"], "1.0": ["Long, but it was worth it. Nice to meet you also, Mike, thank you.", 0, "\"Nice to meet you also, thank you\" sounds a bit stiff, but okay…", "很長，但值得。也很高興見到你，Mike，謝謝。（語氣生硬）"], "1.1": ["Yes, I make exercise four times in a week, mostly the boxing and weights.", 0, "\"Make exercise\"? You mean \"work out\" or \"do exercise.\"", "是，我一週「做運動」四次，主要是拳擊和重訓。（make exercise 搭配錯誤）"], "1.2": ["I did! I'm a big fan. Honestly, I didn't expect that knockout to coming.", 0, "\"To coming\"? Grammar's a bit off there, buddy.", "我有看！我是大粉絲。老實說，我沒預料到那個 KO 會來。（文法錯）"], "2.0": ["Fair question. There's a trade-off: their price is lower, but they are worse in everything.", 0, "\"Worse in everything\"? That's a big claim. Can you back it up?", "問得好。有取捨：他們價格低，但他們什麼都比較差。（空泛貶低對手）"], "2.1": ["Option A is more cheap, but Option B is more reliable and catches almost all the defects.", 0, "\"More cheap\"? You mean \"cheaper.\"", "A 方案「更便宜」，但 B 更可靠，幾乎抓出所有瑕疵。（比較級錯誤）"], "2.2": ["As an alternative, you could just buy two machines now and maybe buy the rest when you have money.", 0, "\"When you have money\"? That sounds a little rude.", "替代方案是，你們可以先買兩台，等有錢再買剩下的。（語氣失禮）"], "2.3": ["If I were you, I'd choose Option B for sure. It costs more now, but it saves money in a long run.", 0, "\"In a long run\"? It's \"in the long run.\"", "如果我是你，我一定選 B。現在貴，但長期省錢。（in a long run 冠詞錯）"], "3.0": ["I completely understand, and I'm sorry. But honestly, two weeks is not that long for a machine like this.", 0, "Not that long? For us it's a disaster.", "我完全理解，也很抱歉。但說實話，這種機器晚兩週不算久。（淡化問題）"], "3.1": ["The root cause was the chip shortage, which is everyone's problem, not only ours.", 0, "\"Everyone's problem\" sounds like you're dodging responsibility.", "根本原因是晶片短缺，這是大家的問題，不只是我們的。（推卸責任）"], "3.2": ["As a workaround, we can ship the key parts by air, but your company would need to pay the extra cost for that.", 0, "We pay for your delay? That's not a workaround, that's a bill.", "權宜之計是空運關鍵零件，但額外運費要由貴公司負擔。（要客戶付錢）"], "3.3": ["To prevent this happening again, we will try to be much more careful with our suppliers next time, I promise.", 0, "\"Try to be careful\" isn't a plan. What will you actually change?", "為了避免再發生，我們下次會盡量對供應商更小心，我保證。（沒有具體方案）"], "4.0": ["Sorry, my connection is bad. Can you hear me more better now, Mike?", 0, "\"More better\"? Just \"better.\"", "抱歉，我網路不好。現在聽得「更更清楚」嗎？（比較級錯誤）"], "4.1": ["Sorry, could you repeat the last part again? Did you say the on-site training is including?", 0, "\"Including\"? You mean \"included.\"", "抱歉，可以再重複最後一段嗎？你是說現場訓練「包含中」嗎？（分詞用錯）"], "4.2": ["Oops, sorry about that! I was muted. Can you listen to me now?", 0, "\"Listen to me\"? You mean \"hear me.\"", "哎呀抱歉！我剛靜音了。你現在可以「聆聽」我嗎？（hear / listen 混用）"], "4.3": ["It's per unit. Just to clarify, the installation is not including in it.", 0, "\"Not including in it\"? You mean \"not included.\"", "是單價。補充一下，安裝不「包含在內中」。（文法錯）"], "4.4": ["Sure. I'll follow up you with an email before the end of today.", 0, "\"Follow up you\"? It's \"follow up with you.\"", "好的。我今天下班前會「追蹤你」寄 email。（follow up 搭配錯）"], "5.0": ["Thanks, Mike. Today I'm going to tell you everything about our company history first, and then the machine.", 0, "Company history first? We only have twenty minutes.", "謝謝 Mike。今天我先完整介紹公司歷史，然後再講機器。（離題、不重點）"], "5.1": ["The main feature is the AI defect detection. It learns your products, so the accuracy is keeping improving.", 0, "\"Is keeping improving\"? Grammar's a bit tangled.", "主要功能是 AI 瑕疵偵測。它學習你的產品，所以準確度「正在持續改善中」。（文法錯）"], "5.2": ["The biggest benefit is our machine is very fast and very smart, faster and smarter than any other machine.", 0, "Fast and smart… but what does that mean for our numbers?", "最大好處是我們的機器很快很聰明，比任何機器都快都聰明。（空泛，沒講對客戶的好處）"], "5.3": ["Sorry! This never happened before, I don't know why. Maybe it's your Wi-Fi? Let me restart it, sorry.", 0, "Our Wi-Fi? Hmm, blaming us doesn't help.", "抱歉！從來沒發生過，我不知道為什麼。也許是你們的 Wi-Fi？我重開，抱歉。（慌張、怪客戶）"], "6.0": ["I understand. Twenty percent is difficult for us, so maybe you can ask VisionTek for that discount instead.", 0, "Are you telling me to go to your competitor?", "我理解。20% 對我們很難，也許你可以去問 VisionTek 要這個折扣。（把客戶推走）"], "6.1": ["In return of a two-year contract, we can include the free maintenance service for you.", 0, "\"In return of\"? It's \"in return for.\"", "作為兩年合約的「回報的」，我們可以附贈免費維護。（介系詞錯）"], "6.2": ["That's a good offer. But please remember, cheap things are always bad quality, everybody knows.", 0, "\"Cheap things are always bad\"? That's not an argument.", "這個條件不錯。但請記得，便宜沒好貨，大家都知道。（以偏概全）"], "6.3": ["How about we meet in the half? Twelve percent, plus free training for all your team.", 0, "\"Meet in the half\"? You mean \"meet halfway.\"", "不如我們「在一半見面」？12%，再加你們全隊免費訓練。（慣用語錯）"], "6.4": ["Great! I'm glad that finally you accept our deal. It took a long time, haha.", 0, "\"Finally you accept\"? That makes it sound like a battle.", "太好了！很高興你終於接受我們的條件。花了好久，哈哈。（語氣像勝負）"], "7.0": ["Hi Linda, attached please find the quote which is updated. If any questions, let me know please.", 0, "Very stiff and a bit broken. Try a simpler, natural sentence.", "Linda 你好，附件請查收已更新報價。若有任何問題，請讓我知道請。（句子生硬、文法錯）"], "7.1": ["Regarding to the installation, I'm free on Tuesday or Wednesday afternoon. Which one is better?", 0, "\"Regarding to\"? Just \"regarding.\"", "「關於到」安裝，我週二或週三下午有空。哪個比較好？（regarding to 錯誤）"], "7.2": ["As discussed, I can confirm you that the machines will deliver on June 15.", 0, "\"Confirm you\" and \"will deliver\"? Grammar slips there.", "如討論，我可以「確認你」機器會在 6/15「送出自己」。（文法錯）"], "7.3": ["Thanks, Mike. Please send it back signed ASAP, because my boss keeps asking me about it every day.", 0, "Your boss's pressure isn't really my problem, Henry.", "謝謝 Mike。請盡快簽回，因為我老闆每天都在問。（把壓力丟給客戶）"], "8.0": ["(Take it with one hand and put it away quickly.) Thank you, Mr. Tanaka. Here is mine.", 0, "(Mr. Tanaka looks slightly uncomfortable.)", "（單手接過並很快收起來。）謝謝田中先生，這是我的。（日本商務禮儀不佳）"], "8.1": ["Of course. But please decide soon, because our price may go up next month, you know.", 0, "Pressure tactics… that's not how we do business here.", "當然。但請盡快決定，因為下個月可能漲價喔。（給壓力）"], "8.2": ["Fair point. The accuracy is very high, around zero point two, and it is very, very fast, I think.", 0, "Around 0.2 what? And \"I think\"? We need exact numbers.", "說得對。準確度很高，大約 0.2，而且非常非常快，我想。（不精確）"], "8.3": ["To be straightforward, we are not cheap. But VisionTek's machines break all the time, so you will be sorry.", 0, "\"You will be sorry\"? That sounds like a threat.", "直說吧，我們不便宜。但 VisionTek 的機器常壞，你會後悔的。（攻擊對手、像威脅）"], "8.4": ["That would be a honor. I'll arrange a visit for you and your team in Taiwan.", 0, "\"A honor\"? It's \"an honor.\"", "那將是「一個」榮幸。我會為您和團隊安排參訪。（冠詞錯）"], "9.0": ["Yes, I have a reservation on the name of Henry Yeh, for three nights.", 0, "\"On the name of\"? It's \"under the name.\"", "是，我有訂房，「在」Henry Yeh 的名字上，三晚。（介系詞錯）"], "9.1": ["Sure, but why do you need my credit card if I already paid online?", 0, "Just for incidentals, sir. But your tone…", "好，但我已經線上付款了，為什麼還要信用卡？（語氣不耐）"], "9.2": ["Hi, this is room 1208. The air conditioner is broken and this is unacceptable. Send someone right now.", 0, "Very demanding. A polite request works better.", "你好，1208 房。冷氣壞了，這不能接受。馬上派人來。（太兇）"], "9.3": ["I see. In this case, could you change me to another room?", 0, "\"Change me\"? You mean \"move me to another room.\"", "了解。這種情況，可以「換掉我」到另一間房嗎？（change me 用法錯）"], "10.0": ["Almost. What can you recommend me?", 0, "\"Recommend me\"? Usually \"What do you recommend?\"", "差不多。你可以「推薦我」什麼？（recommend me 不自然）"], "10.1": ["Medium-cooked, please, not too much.", 0, "\"Medium-cooked\"? Steak doneness is \"medium\" or \"medium-rare.\"", "請煮中等的，不要太多。（牛排熟度說法錯）"], "10.2": ["Oh, I'm allergy to peanuts. Could I have it without sauce?", 0, "\"Allergy to\"? It's \"allergic to.\"", "喔，我「過敏症」花生。可以不加醬嗎？（詞性錯）"], "10.3": ["Sure, let's split it. Excuse me, could we get the bill separately, the bill?", 0, "A bit repetitive and confusing.", "好，我們分攤。不好意思，可以分開帳單嗎，帳單？（重複、混亂）"], "11.0": ["Yes, it's my first time. My left shoulder is a bit sour, so I'll take it easy today.", 0, "\"Sour\"? You mean \"sore.\"", "對，第一次。我左肩有點「酸（味）」，今天會放輕鬆。（sore / sour 混淆）"], "11.1": ["Got it. How fast should I jump it, fast or slow?", 0, "\"Jump it\"? Just \"jump rope.\"", "了解。我應該「跳它」多快？（不自然）"], "11.2": ["Like this? Could you teach me the correct form one more again?", 0, "\"One more again\"? Just \"one more time.\"", "像這樣？可以「再一次又」教我正確姿勢嗎？（重複錯誤）"], "11.3": ["Exhausted, but great. I'll definitely come back in next week.", 0, "\"In next week\"? Just \"next week.\"", "累壞了但很棒。我「在下週」一定會回來。（介系詞多餘）"], "12.0": ["I have a sore throat and a little fever. Do you sell anything without prescription?", 0, "Understandable, but \"over-the-counter\" is the natural phrase.", "我喉嚨痛又有點發燒。你們有賣不需處方的藥嗎？（可懂但不道地）"], "12.1": ["Since yesterday morning, about.", 0, "\"About\" at the end sounds odd.", "從昨天早上，大約。（語序怪）"], "12.2": ["Okay. Are there any side effect that I should be knowing about?", 0, "\"Side effect that I should be knowing\"? Grammar slip.", "好。有任何我「應該正在知道」的副作用嗎？（文法錯）"], "12.3": ["Got it. No alcohol. But I have a client dinner tonight, so maybe just one or two glasses is okay?", 0, "No — \"no alcohol\" means none.", "了解，不喝酒。但我今晚有客戶餐會，喝一兩杯應該可以吧？（不聽醫囑）"], "13.0": ["Cheers! It's very big. Taiwan is making most of the advanced chips of the world.", 0, "Understandable, but a bit clunky.", "乾杯！很大。台灣正在製造世界上大部分的先進晶片。（表達生硬）"], "13.1": ["Hmm, that's risky. You should spread your eggs into many baskets, like an ETF.", 0, "\"Spread your eggs\"? The idiom is \"don't put all your eggs in one basket.\"", "嗯，有風險。你應該把蛋分散到很多籃子，像 ETF。（慣用語用錯）"], "13.2": ["Maybe some stocks are overpriced, but I believe AI will keep growing in the long time.", 0, "\"In the long time\"? It's \"in the long term\" or \"in the long run.\"", "也許有些股票太貴，但我相信 AI 長「時間」會持續成長。（搭配錯）"], "13.3": ["Ha, I'm biased, so don't ask me! But seriously, buy it now before the price goes up.", 0, "Wait, you just said you're biased.", "哈，我有偏見別問我！但說真的，趁還沒漲趕快買。（自相矛盾、亂給建議）"], "13.4": ["I'd love to, but I have a meeting early. Next round is on you!", 0, "\"Next round is on you\"? That's a bit cheeky.", "很想，但我明早有會。下一輪你請！（語氣不妥）"], "14.0": ["Nice to meet you, Sarah. Please sit down. Did you find the office easy?", 0, "\"Find the office easy\"? Better \"easily.\"", "很高興認識妳，Sarah。請坐。妳找辦公室「簡單的」嗎？（詞性錯）"], "14.1": ["That's great. Could you tell me about a big deal that you made close?", 0, "\"Made close\"? It's \"a deal you closed.\"", "很好。可以談談一筆你「讓它關閉」的大單嗎？（搭配錯）"], "14.2": ["Interesting. Can you give me an example how did you do that?", 0, "\"How did you do that\" inside a question? Word order slip.", "有意思。可以舉個例子妳是怎麼做的嗎？（間接問句語序錯）"], "14.3": ["Of course. The range is sixty to seventy thousand. But first, how much do you want? Be honest.", 0, "\"How much do you want?\" sounds a bit pushy.", "當然。範圍是六到七萬。但先說，妳想要多少？老實說。（語氣太直）"], "14.4": ["We'll get back to you on Friday or maybe later. Thank you again for your time.", 0, "\"Or maybe later\" sounds unsure.", "我們週五或晚一點會回覆妳。再次謝謝妳的時間。（不明確）"], "15.0": ["Sure. As you can see on this chart, the revenue was growing twelve percent this quarter.", 0, "\"Was growing twelve percent\"? Better \"grew by twelve percent.\"", "好的。如圖所示，本季營收「正在成長」12%。（時態、介系詞錯）"], "15.1": ["Orders were declined in May, because one big client delayed their project. It recovered in June.", 0, "\"Were declined\"? Orders \"declined\" (no passive).", "五月訂單「被拒絕」，因為大客戶延後專案，六月回升。（被動用錯）"], "15.2": ["Compare to last year, we're up about ten percent overall.", 0, "\"Compare to\"? It's \"compared to.\"", "「比較」去年，我們整體成長約 10%。（分詞錯）"], "15.3": ["We forecast a steady growth, around eight percent, if the two new deals will close.", 0, "\"If … will close\"? Use present after \"if.\"", "我們預測穩定成長約 8%，如果兩筆新單「將會」成交。（if 子句時態錯）"], "15.4": ["Absolutely. I'll send them for you in this afternoon.", 0, "\"For you in this afternoon\"? Use \"to you this afternoon.\"", "當然。我會「為你在」今天下午寄出。（介系詞錯）"], "16.0": ["I'm really sorry, Dave. But to be fair, the machine worked fine for the first three weeks.", 0, "\"To be fair\"? Not what I want to hear right now.", "真的很抱歉，Dave。但說句公道話，機器前三週都很正常。（辯解）"], "16.1": ["E-42 is usually a camera sensor issue. I'll look after it with our engineers right away.", 0, "\"Look after\"? You mean \"look into.\"", "E-42 通常是相機感測器問題。我會馬上和工程師「照顧」它。（片語動詞用錯）"], "16.2": ["We'll ship a replacement sensor today, and an engineer can be there tomorrow, maybe afternoon or evening.", 0, "Maybe? We need a firm time.", "今天寄替換感測器，工程師明天會到，也許下午或晚上。（不明確）"], "16.3": ["I completely understand. To make up to you, we'll extend your warranty for six months.", 0, "\"Make up to you\"? It's \"make it up to you.\"", "我完全理解。為了「彌補到你」，我們會延長保固六個月。（片語錯）"], "16.4": ["Of course. I'll call you every four hours until it's fixed. Sorry again for your inconvenient.", 0, "\"Your inconvenient\"? It's \"the inconvenience.\"", "當然。修好前每四小時打給你。再次為你的「不方便的」道歉。（詞性錯）"], "17.0": ["Good morning, Anna. Sure, follow me. Here are your safe glasses, please wear it.", 0, "\"Safe glasses\" and \"wear it\"? Safety glasses, wear them.", "早安 Anna。好，跟我來。這是妳的「安全的」眼鏡，請戴「它」。（用字、單複數錯）"], "17.1": ["Of course. Every batch is checked by this procedure, and we keep the records for five years or so.", 0, "\"Five years or so\"? Auditors need exact retention periods.", "當然。每批都依程序檢查，紀錄保存五年左右。（不精確）"], "17.2": ["A supplier sent us a bad batch, so it was really their fault, not ours. We already told them.", 0, "Blaming the supplier isn't corrective action.", "供應商送來一批壞料，所以其實是他們的錯不是我們的，我們已經告訴他們了。（推責、無矯正措施）"], "17.3": ["Yes, all our products follow RoHS, I think. I can try to find the certificates for you.", 0, "\"I think\"? \"Try to find\"? That's not reassuring.", "是，我想我們產品都符合 RoHS。我可以試著找證書給妳。（不確定）"], "17.4": ["Thank you. Could you share the details? We'll fix them quickly, no need for a formal plan.", 0, "No formal plan? We need a corrective action plan.", "謝謝。可以分享細節嗎？我們會很快改好，不需要正式計畫。（忽略程序）"], "18.0": ["Sure. Our standard payment terms are thirty percent before and seventy percent after the delivery.", 0, "\"Before\" and \"after\"? Say \"upfront\" and \"on delivery.\"", "好的。標準付款條件是交貨前 30%、交貨後 70%。（用字不精確）"], "18.1": ["There's a penalty of half percent each week, until maximum five percent of the contract value.", 0, "Understandable, but the grammar is shaky.", "每週罰款半個百分比，直到最多合約金額的 5%。（文法鬆散）"], "18.2": ["Yes, the warranty covers parts and labor for two years, including any damage, no matter what happens.", 0, "Including any damage? Even if we drop it? That's hard to believe.", "是，保固兩年含零件與工資，任何損壞都包，不管發生什麼事。（過度承諾）"], "18.3": ["That should be fine, I think. Let me just say yes now, and I'll check with our factory later.", 0, "Say yes now and check later? That's risky.", "應該可以吧。我先答應，之後再跟工廠確認。（輕率承諾）"], "18.4": ["Great. I'll get it signed out today and send you the final version.", 0, "\"Signed out\"? It's \"signed off.\"", "好。我今天會把它「簽退」，再寄最終版給你。（片語用錯）"], "19.0": ["Yes, on Henry Yeh. A small car for three days, compact one.", 0, "A bit broken. Try \"under Henry Yeh.\"", "對，在 Henry Yeh。三天小車，小型的。（介系詞、句子破碎）"], "19.1": ["What does it cover? Is the basic insurance already including?", 0, "\"Including\"? You mean \"included.\"", "保什麼？基本險「包含中」嗎？（分詞錯）"], "19.2": ["Got it. Is there a gas station that is near to the airport?", 0, "\"Near to the airport\"? Just \"near the airport.\"", "了解。有沒有「靠近到」機場的加油站？（介系詞多餘）"], "19.3": ["So, two blocks straight, then the left at second light. Thank!", 0, "\"Thank\"? And a few articles are missing.", "所以直走兩個路口，在第二個燈「那個左」。謝！（文法錯）"], "19.4": ["How far is it from here? Can I go on foot, or should I take driving?", 0, "\"Take driving\"? Just \"drive.\"", "離這多遠？我可以走路，還是應該「拿開車」？（搭配錯）"], "20.0": ["I'm looking for a jacket to my wife. Something warm, maybe in a dark blue.", 0, "\"To my wife\"? It's \"for my wife.\"", "我在找一件「給到」我太太的外套。溫暖的，也許深藍。（介系詞錯）"], "20.1": ["It's for my wife, but thanks. Do you have this in small size, the small one?", 0, "A bit repetitive. \"In a small\" is enough.", "是給我太太的，謝謝。有小號嗎，小的那件？（重複）"], "20.2": ["I bought this yesterday, but the size is wrong. You need to change it to a medium for me.", 0, "\"You need to\" sounds like an order.", "我昨天買的，尺寸不對。你必須幫我換成 M。（命令語氣）"], "20.3": ["Yes, here it is. The tags are still on it, and I didn't wear it, I promise you.", 0, "\"I promise you\" isn't needed; sounds defensive.", "有，在這。吊牌還在，我沒穿過，我保證。（過度辯解）"], "20.4": ["I'm flying home tomorrow, so I prefer a refund into my credit card, if possible please.", 0, "\"Into my credit card\" and \"if possible please\"? A bit clumsy.", "我明天回國，所以我比較想退款「進」信用卡，如果可以請。（介系詞、語序）"], "21.0": ["Four hours? I have a meeting tonight. Is there any earlier flight that I can change into?", 0, "\"Change into\"? You'd \"switch to\" a flight.", "四小時？我今晚有會。有沒有我可以「變身成」的更早航班？（片語錯）"], "21.1": ["Thank you. Could you put me on the standby list, just in a case?", 0, "\"Just in a case\"? It's \"just in case.\"", "謝謝。可以把我放進候補名單嗎，「以防一個萬一」？（慣用語錯）"], "21.2": ["Hi, my suitcase is lost. I waited at the baggage claim for an hour, but it never came out, so where is it?", 0, "\"So where is it?\" sounds accusing.", "你好，我行李不見了。我在行李轉盤等了一小時都沒出來，所以它在哪？（質問語氣）"], "21.3": ["It's a big black suitcase, hard one, with a red tag. My name is on the tag, Henry Yeh.", 0, "Understandable, but a bit choppy.", "一個大的黑色行李箱，硬的，有紅色吊牌，名字在吊牌上，Henry Yeh。（句子破碎）"], "21.4": ["That's a relief. Could you send it to my hotel tonight? I need my suit for tomorrow, it's very important.", 0, "Understandable, but a little wordy compared to the natural version.", "鬆了口氣。可以今晚送到飯店嗎？我明天需要西裝，非常重要。（尚可但冗長）"], "22.0": ["I'm rooting to the underdog. His ground game is really strong.", 0, "\"Rooting to\"? It's \"rooting for.\"", "我「支持到」弱勢的那位。他地面技很強。（介系詞錯）"], "22.1": ["True, but if it goes on the floor, I think he'll win with submission.", 0, "\"On the floor\" / \"with submission\"? Say \"to the ground\" / \"by submission.\"", "沒錯，但如果打到「地板上」，我想他會「用」降伏勝。（搭配錯）"], "22.2": ["I make boxing three times a week, and I just started to learn some jiu-jitsu.", 0, "\"Make boxing\"? You \"do boxing.\"", "我一週「製作拳擊」三次，剛開始學柔術。（搭配錯）"], "22.3": ["Unbelievable! I told you so, that's a perfect knockout.", 0, "Knockout? He tapped — that's a submission.", "不可思議！我就說吧，完美的 KO。（用詞錯：投降是 submission）"], "22.4": ["Totally. I would pay for watching that rematch. Same place next time?", 0, "\"Pay for watching\"? It's \"pay to watch.\"", "完全同意。我願意「為了觀看」那場復仇賽付錢。下次同地方？（文法錯）"], "23.0": ["Sure. Hi everyone, I'm Henry. I'm based on Taipei, and I'm in charge for overseas sales.", 0, "\"Based on\" and \"in charge for\"? It's \"based in\" / \"in charge of.\"", "好。大家好，我是 Henry，我「基於」台北，「負責為」海外業務。（介系詞錯）"], "23.1": ["We make AI inspection systems for factories. Basically, our cameras find defects that humans miss them.", 0, "\"That humans miss them\"? Drop the extra \"them.\"", "我們做工廠用的 AI 檢測系統。基本上，我們的相機找出人類漏看「它們」的瑕疵。（多餘代名詞）"], "23.2": ["I'm really into boxing and fitness, and I follow tech stocks every day, every hour, all the time.", 0, "A bit much? Sounds like an obsession.", "我很愛拳擊和健身，而且我每天每小時都在盯科技股。（誇張、不自然）"], "23.3": ["About three years. It helps me to manage the stress of work.", 0, "Fine, but \"stress from work\" sounds more natural.", "大約三年。它幫助我管理工作的壓力。（尚可但較不自然）"], "23.4": ["I'd love that. Let's exchange our contact. Are you in LinkedIn?", 0, "\"Contact\" (plural \"contacts\") and \"in LinkedIn\"? It's \"on LinkedIn.\"", "好啊。我們交換聯絡方式。你「在」LinkedIn「裡面」嗎？（介系詞錯）"], "24.0": ["I appreciate your honesty. But our prices are already very low, so I'm afraid there's not much we can do.", 0, "Not much you can do? Then why are we meeting?", "謝謝你的坦白。但我們價格已經很低，恐怕沒什麼能做的。（關上談判門）"], "24.1": ["I understand. But please remember you get what you pay for. Cheap machines cost more in the end.", 0, "A bit preachy. Show me numbers instead.", "我理解。但請記得一分錢一分貨，便宜機器最後更貴。（說教）"], "24.2": ["If you can commit to a three-year contract, we could go down to eight percent. But we can talk more if needed.", 0, "\"We can talk more\"? So eight percent isn't really your bottom line.", "如果簽三年，我們可以降到 8%。但需要的話還可以再談。（底線不明）"], "24.3": ["That's something we can work with. Training is negotiable, and maybe the payment terms are negotiable too.", 0, "Everything's negotiable? Then I'll push on payment too.", "這個可以談。訓練可以談，付款條件可能也可以談。（讓步過多）"], "24.4": ["Great. I think it's a win-win. Could you write down what we agreed and send it to me?", 0, "Asking the client to do your follow-up work? Hmm.", "好。雙贏。可以請你把我們的共識寫下來寄給我嗎？（把工作推給客戶）"], "25.0": ["I hear your frustration, Kevin. But Sales has targets, and Engineering has to support us, that's the job.", 0, "\"That's the job\"? That will make Kevin angrier.", "我聽到你的不滿，Kevin。但業務有業績，工程本來就該支援我們。（激化衝突）"], "25.1": ["With all due respect, the client was told four weeks was our target, not the guarantee. So it's not my problem.", 0, "\"Not my problem\" undoes the polite start.", "恕我直言，客戶被告知的是目標四週而非保證。所以不是我的問題。（推卸）"], "25.2": ["I think we have a common land: we both want happy clients. So Engineering should just work a bit faster.", 0, "\"Common land\"? It's \"common ground.\" And blaming Engineering won't help.", "我想我們有「共同土地」：都想讓客戶滿意。所以工程只要快一點就好。（慣用語錯＋推責）"], "25.3": ["I'd rather we try fixing it by ourselves first. If it doesn't improve within a month, then we escalator it.", 0, "\"Escalator it\"? The verb is \"escalate.\"", "我寧可我們先自己修正。如果一個月內沒改善，我們再「電扶梯」它。（詞性錯）"], "25.4": ["Kevin, why don't we take this outline? Let's grab thirty minutes this afternoon to draft a new process.", 0, "\"Outline\"? You mean \"offline.\"", "Kevin，我們把這件事「大綱」吧？今天下午抓 30 分鐘擬新流程。（用字錯）"], "26.0": ["I've hit a plateau. My bench is stucking at eighty kilos since three months.", 0, "\"Is stucking … since three months\"? Grammar's off.", "我遇到瓶頸。我的臥推「正在卡住」在 80 公斤「自從三個月」。（文法錯）"], "26.1": ["Honestly, only six hours. But I train chest four times a week, so my chest is definitely not the problem.", 0, "Four times a week might BE the problem.", "老實說只睡六小時。但我一週練胸四次，所以胸肯定不是問題。（自以為是）"], "26.2": ["That makes sense. So I should train more smart, not more hard, and sleep more?", 0, "\"More smart, more hard\"? It's \"smarter, not harder.\"", "有道理。所以我應該練得「更聰明的」而不是「更困難的」，然後多睡？（比較級錯）"], "26.3": ["Got it. Small, steady increases, so I don't need to max out never.", 0, "\"Don't need to … never\"? Double negative.", "了解。小幅穩定增加，所以我「不需要從不」衝極限。（雙重否定）"], "26.4": ["Stop and tell you. But if it's just a little sharp pain, I can continue, right?", 0, "No. Sharp pain means stop.", "停下來告訴你。但如果只是一點刺痛，可以繼續吧？（危險）"], "27.0": ["I did! It could be a game changer, but I'm a bit worry about the privacy.", 0, "\"I'm a bit worry\"? It's \"worried.\"", "有看到！可能改變遊戲規則，但我有點「擔心（動詞）」隱私。（詞性錯）"], "27.1": ["Fair point. But unlike the metaverse, people actually use AI at work every day, so it's totally not overhyped.", 0, "\"Totally not overhyped\"? That's a strong claim.", "說得有理。但和元宇宙不同，大家每天在工作中用 AI，所以完全沒有過度炒作。（過度絕對）"], "27.2": ["I follow a few newsletters and podcasts. Otherwise, it's impossible to keep up it.", 0, "\"Keep up it\"? Just \"keep up.\"", "我追幾個電子報和 podcast，不然不可能「跟上它」。（片語錯）"], "27.3": ["Maybe for simple trips. For complicated ones, it still remains to see.", 0, "\"Remains to see\"? It's \"remains to be seen.\"", "簡單行程也許會。複雜的還「有待看」。（被動錯）"], "27.4": ["Only if it asks me confirm before paying. I'd want to have the final saying.", 0, "\"Asks me confirm\" and \"final saying\"? It's \"to confirm,\" \"final say.\"", "只有付款前「要我確認」才行。我要「最後的諺語」。（文法、用字錯）"], "28.0": ["Dear Klaus, thanks for your feedback. Our team was very busy last week, so please understand the slow response.", 0, "\"Please understand\" sounds like an excuse, not an apology.", "Klaus 您好，謝謝回饋。上週團隊很忙，請理解回覆較慢。（找藉口）"], "28.1": ["Going forward, you'll have a dedicated contact, and we'll try to reply within one or two business days.", 0, "\"Try to\" and \"one or two\"? That's weaker than before.", "今後您會有專屬窗口，我們會盡量在一到兩個工作天內回覆。（承諾模糊）"], "28.2": ["Yes. In light of the delay, I'd like to propose that you sign the contract this week to get a better price.", 0, "Pushing a sale right after an apology? Bad timing.", "是的。鑑於延誤，我建議您本週簽約以取得更好的價格。（時機不當）"], "28.3": ["It gives your team more time to try the system, and to be honest, it also gives us more time to convince you.", 0, "At least you're honest… but that's not a benefit for us.", "讓你們多點時間試用；老實說，也讓我們多點時間說服你們。（說錯重點）"], "28.4": ["Thank you. Please let me know your decision by tomorrow, because I need to report it to my manager.", 0, "Tomorrow? I said I'll think about it.", "謝謝。請明天前告訴我決定，因為我要回報主管。（施壓）"], "29.0": ["I get why you're upset, but you're wrong. The judges got it right, obviously. He won two rounds of three.", 0, "\"You're wrong… obviously\" is a bit harsh.", "我懂你為什麼不爽，但你錯了。裁判判得對，很明顯。他三局贏兩局。（語氣太衝）"], "29.1": ["True, but he ran out of gas after that. His cardio just wasn't there, honestly speaking.", 0, "Not wrong, but \"gassed out\" is the fight-fan phrase, and it's wordy.", "沒錯，但他之後沒油了。老實說，他的心肺就是不夠。（尚可但冗長）"], "29.2": ["I think his plan was to survive early and let him burn up, then take over late. Give credit where it's due.", 0, "\"Burn up\"? You mean \"burn out.\"", "我想他的計畫是先撐住，讓對手「燒起來」，再後段接管。該給的肯定要給。（片語錯）"], "29.3": ["Definitely. If the first guy works on his cardio, it could go both ways.", 0, "\"Both ways\"? The idiom is \"either way.\"", "當然。如果第一位加強心肺，結果可能「兩邊都去」。（慣用語錯）"], "29.4": ["I'm leaning to the challenger. He's younger, and his wrestling has improved very much.", 0, "\"Leaning to\"? It's \"leaning towards.\"", "我「傾向到」挑戰者。他比較年輕，摔跤進步很多。（介系詞錯）"], "30.0": ["Thank you. I know I did a great job. Honestly, I did most of the Delta account by myself.", 0, "Hmm, that's not very team-oriented.", "謝謝。我知道我做得很好。老實說 Delta 大部分是我自己做的。（居功）"], "30.1": ["You're right, but the client also changed requirements many times. I take part of ownership of that.", 0, "\"Part of ownership\"? Sounds like half an excuse.", "你說得對，但客戶也改了很多次需求。我承擔「部分的所有權」。（半推卸）"], "30.2": ["That's a constructive feedback. Could you suggest one or two things that I could do it differently?", 0, "\"A constructive feedback\" and \"do it differently\"? Two slips.", "那是「一個」建設性回饋。可以建議一兩件我可以「做它」不同的事嗎？（文法錯）"], "30.3": ["I'd like to move into a regional sales manager role, or maybe your role, if you leave the company, haha.", 0, "Joking about taking my job… awkward.", "我想升區域業務經理，或者如果你離職的話，接你的位子，哈哈。（不得體）"], "30.4": ["It would be great if I could join the leadership training next spring, and also get a big raise, of course.", 0, "\"Of course\"? Raises aren't automatic.", "如果明年春天能參加領導力培訓會很棒，當然也要大幅加薪。（不得體）"], "31.0": ["I've had a lower back pain since about one week, and it's getting worse and worse.", 0, "\"Since about one week\"? It's \"for about a week.\"", "我「自從大約一週」有下背痛，而且越來越糟。（介系詞錯）"], "31.1": ["It's mostly a dull pain, but I get sharp pain when I bend over or lift up something heavy, like boxes.", 0, "Understandable, though \"dull ache\" is the usual phrase.", "大多是悶痛，但我彎腰或抬起重物（像箱子）時會刺痛。（用字較不道地）"], "31.2": ["Usually around four, but it flares to seven after a long flight, especially more than ten hours.", 0, "Understandable but choppy; \"flares up to a seven.\"", "通常約 4，但長途飛行後「燃燒」到 7，尤其超過十小時。（片語不完整）"], "31.3": ["No, not anything like that. It's only on my lower back, not my legs.", 0, "\"On my lower back\"? Usually \"in my lower back.\"", "沒有，沒那種情況。只「在上面」下背，不在腿。（介系詞）"], "31.4": ["Understood. If it doesn't improve, could you refer me a physiotherapist, please?", 0, "\"Refer me a physiotherapist\"? It's \"refer me to.\"", "了解。如果沒改善，可以「轉診我一位」物理治療師嗎？（介系詞缺）"], "32.0": ["Two main factors: the currency and the component costs. But honestly, it's not a big deal, margins go up and down every quarter.", 0, "\"Not a big deal\"? Analysts will hate that.", "兩個主因：匯率和零件成本。但說實話沒什麼大不了，毛利每季都上上下下。（輕忽）"], "32.1": ["No, we're reaffirming our guidance, at least for now. Of course, we cannot promise anything in this market.", 0, "\"Cannot promise anything\" undercuts the reaffirmation.", "不，我們重申財測，至少目前是。當然，這個市場我們什麼都無法保證。（自相矛盾）"], "32.2": ["As a policy, we don't comment on rumors. But I can say the Japanese market is very interesting for us.", 0, "That sounds like a hint. Now everyone will speculate.", "依政策我們不評論傳言。但我可以說日本市場對我們很有吸引力。（暗示＝變相評論）"], "32.3": ["We think it's structural rather than cyclical, so there will be no volatility from quarter to quarter at all.", 0, "\"No volatility at all\"? Nobody believes that.", "我們認為這是結構性而非週期性，所以季與季之間完全不會有波動。（過度承諾）"], "32.4": ["Honestly, talent. But it's the same for everyone in the industry, so it's not really a problem for us.", 0, "\"Not really a problem\"? Then why say it keeps you up?", "老實說是人才。但整個產業都一樣，所以對我們不算問題。（自相矛盾）"], "33.0": ["Factories lose billions because of defects that human inspectors miss them. We solve this pain with AI vision.", 0, "\"Miss them\" and \"solve this pain\"? Two slips.", "工廠因人工檢查漏看「它們」的瑕疵損失數十億。我們用 AI 視覺「解決這個疼痛」。（文法、搭配錯）"], "33.1": ["Yes. We have twelve customers who are using it, and revenue is tripled over the past year.", 0, "\"Revenue is tripled\"? It's \"has tripled.\"", "有。我們有 12 個在用的客戶，營收過去一年「被三倍」。（時態錯）"], "33.2": ["They could try, but our edge is the data. We have twenty million defect images, and Siemens is too slow to catch up.", 0, "\"Too slow\"? Underestimating a giant is a red flag for investors.", "他們可以試，但我們的優勢是資料。我們有兩千萬張瑕疵影像，西門子太慢追不上。（輕敵）"], "33.3": ["We burn about eighty thousand a month. With this round, we will have around eighteen months runway, more or less.", 0, "\"More or less\" sounds vague to investors.", "我們每月燒約 8 萬。這輪之後大約有 18 個月跑道，差不多。（不精確）"], "33.4": ["We're raising two million dollars, but honestly any amount would help us a lot, even half of that.", 0, "\"Any amount\"? That signals weak confidence.", "我們募 200 萬美元，但說實話任何金額都很有幫助，一半也好。（缺乏自信）"], "34.0": ["It is, actually. I'm very nervous, so please forgive me if I say something wrong.", 0, "Very self-deprecating for a dinner.", "是的。我很緊張，如果說錯話請原諒。（過度自貶）"], "34.1": ["You can't go wrong with night markets, but if you want something special, you must try beef noodles at my favorite place, you must.", 0, "\"You must… you must\"? A bit pushy and repetitive.", "夜市不會錯，但想吃特別的，你一定要去我最愛那家牛肉麵，一定要。（重複、強迫）"], "34.2": ["I couldn't agree more. If you don't mind me to ask, how do you decide when you have enough datas?", 0, "\"Mind me to ask\" and \"datas\"? Two slips.", "完全同意。如果你不介意「我去問」，你怎麼判斷「資料們」夠了？（文法錯）"], "34.3": ["I try to understand what's really behind the pushback. Most of the time, they just want a lower price, honestly.", 0, "\"Just want a lower price\" is a bit cynical.", "我試著理解反對背後的原因。老實說，大多時候他們只是想要更低價格。（過於武斷）"], "34.4": ["Likewise. I'll touch the base with you next week about the Southeast Asia plan, if that works for you.", 0, "\"Touch the base\"? It's \"touch base.\"", "彼此彼此。下週我會和你「摸那個壘」談東南亞計畫，如果方便的話。（慣用語錯）"], "35.0": ["I see where you're coming from, but putting everything into one sector seems so risky, especially at the current valuations, you know.", 0, "Okay, but it's wordier and hedgier than needed.", "我懂你的出發點，但全押單一產業很冒險，尤其在現在的估值下，你知道的。（冗長）"], "35.1": ["That's safe, but with inflation, you might actually lose your buying power as time goes by, I'm afraid.", 0, "Not wrong, but \"purchasing power over time\" is the standard phrase.", "很安全，但通膨下你的購買力可能隨時間流失，我恐怕。（較不道地）"], "35.2": ["It really depends on your risk appetite. Personally, I'd put it all in AI stocks, because that's where the growth is.", 0, "All in one sector? Didn't you just say that was risky?", "看風險胃口。我個人會全押 AI 股，因為成長在那裡。（自相矛盾）"], "35.3": ["Nobody can time the market. Historically, the time in market mat
