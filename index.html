function save(){try{const m=new Map();(ST.oldWrong||[]).concat(ST.wrong).forEach(w=>m.set(w.en,w));localStorage.setItem('hero_wrong',JSON.stringify([...m.values()]));localStorage.setItem('hero_best',ST.best)}catch(e){}}

function say(t){if(!t)return;if(!('speechSynthesis'in window)){toast('這個瀏覽器不支援朗讀');return}try{speechSynthesis.cancel()}catch(e){}const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=ST.rate;speechSynthesis.speak(u)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function setBg(n){const b=$('#bgl');if(b)b.style.backgroundImage=n?`url(img/${n}.jpg)`:'none'}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

{who:'Linda',en:'Wait, is that price per unit or for the whole system?',zh:'等等，這個價格是每台的還是整套系統的？',o:[['It\'s per unit. Just to clarify, installation is not included.',1],['Price is price.',0,'Thank you, Captain Obvious.'],['Per unit for the whole system, maybe.',0,'Per unit AND the whole system? Now I\'m more confused.']],why:'Just to clarify, … 用來把容易誤會的地方講清楚。',sk:'speak'},
{who:'Mike',en:'Great. Can you send us a summary after the call?',zh:'很好。會議後可以寄摘要給我們嗎？',o:[['Sure. I\'ll follow up with an email by the end of today.',1],['I will follow you.',0,'Please don\'t follow me. Follow UP, Henry!'],['A summary is not my job.',0,'Then whose job is it? VisionTek\'s?']],why:'follow up = 後續跟進。給明確時間 by the end of today。',sk:'speak'}],
ch:{who:'Mike',en:'Sorry, the line is bad. What did you say about the delivery date?',zh:'抱歉，線路不好。你剛剛說交期是什麼？',task:'禮貌地再說一次交期，並確認對方聽清楚。',rules:[['sorry|apologi','有道歉',20],['deliver|ship|arrive','說到交貨',20],['\\d|week|month|monday|tuesday|wednesday|thursday|friday|june|july','有明確時間',20],['can you hear|is that clear|does that work|did you get','確認對方聽到',20],['clarify|repeat','用了 clarify/repeat',20]],sample:'Sorry about that. Just to clarify, we can deliver the machines in six weeks. Can you hear me clearly now?',sampleZh:'抱歉。釐清一下，我們可以在六週內交機。現在聽得清楚嗎？重點：道歉＋Just to clarify＋明確時間＋確認對方聽到。'}},
{line:'work',bg:'bg_demo',title:'工作 2：產品簡報與現場 Demo',story:'Mike 帶著工程師 Tom 來看 demo。聽說 VisionTek 上週的 demo 很炫。你的筆電已經三年沒重灌了……',
cards:[['walk you through','phr.','一步步帶你了解','Let me walk you through the system.','讓我一步步帶你了解這套系統。'],['feature','n.','功能、特色','The main feature is AI detection.','主要功能是 AI 偵測。'],['benefit','n.','好處、利益','The biggest benefit is lower cost.','最大的好處是成本更低。'],['cycle time','n.','（生產）週期時間','We cut the cycle time by thirty percent.','我們把週期時間縮短了三成。'],['Good catch!','phr.','觀察得好！抓得好！','Good catch! That\'s a typo.','抓得好！那是錯字。']],
qs:[{who:'Mike',en:'The floor is yours, Henry. What are you going to show us today?',zh:'換你上場了，Henry。今天要給我們看什麼？',o:[['Thanks, Mike. Today I\'ll walk you through our new inspection system and do a live demo.',1],['I show you machine. Very good machine.',0,'Very good English… not really.'],['First, let me tell you my life story.',0,'We have thirty minutes, not three hours.']],why:'The floor is yours = 換你發言。walk you through = 一步一步帶你了解，簡報開場很好用。',sk:'listen'},
{who:'Tom',en:'What\'s the main feature that makes it different?',zh:'讓它與眾不同的主要功能是什麼？',o:[['The main feature is AI defect detection. It learns from your products, so accuracy keeps improving.',1],['It has many feature.',0,'Many feature? Many featureS — and which ones?'],['It is different because it is not the same.',0,'Wow, deep. Thanks for nothing.']],why:'先說 feature（功能），再用 so… 帶出效果。feature 複數要加 s。',sk:'speak'},
{who:'Linda',en:'Features are nice, but what\'s the benefit for us?',zh:'功能很好，但對我們有什麼好處？',o:[['The biggest benefit is a shorter cycle time. You can inspect thirty percent more parts per hour.',1],['The benefit is you can be happy.',0,'I\'m happy when costs go down. Numbers, please.'],['You benefit me money.',0,'Ha! I think you mean WE pay YOU money.']],why:'客戶在乎 benefit（好處），用數字說明最有力。cycle time = 生產週期時間。',sk:'speak'},
{who:'Tom',en:'Uh, the screen just froze. Is that normal?',zh:'呃，畫面剛剛當掉了。這正常嗎？',o:[['Good catch! That\'s the demo laptop, not the system. Let me restart it. It\'ll take ten seconds.',1],['It is normal. Everything is fine. Don\'t look.',0,'"Don\'t look"? Now I\'m definitely looking.'],['VisionTek must have hacked my computer!',0,'A conspiracy theory during a demo? Bold move.']],why:'出包時保持冷靜：說明原因、說要多久修好，反而能加分。Good catch = 觀察得好。',sk:'speak'}],
ch:{who:'Tom',en:'In one or two sentences, why should we choose your system over VisionTek\'s?',zh:'用一兩句話說，我們為什麼要選你們而不是 VisionTek？',task:'說出一個功能＋一個好處，最好有數字。',rules:[['feature|\\bai\\b|detect','提到功能',20],['benefit|save|faster|shorter|lower','提到好處',20],['accura|reliab','提到準確或可靠',20],['\\d|percent','有數字',20],['because|so\\b|which means','有因果連接',20]],sample:'Our main feature is AI defect detection, which means higher accuracy. It also shortens your cycle time by thirty percent, so you save money every month.',sampleZh:'我們的主要功能是 AI 瑕疵偵測，代表更高的準確度。它還能縮短三成週期時間，所以每個月都幫你省錢。'}},
{line:'work',bg:'bg_negotiation',title:'工作 3：價格談判攻防',story:'Linda 是公司裡出名的「砍價殺手」。她說 VisionTek 開了更好的條件。你的老闆傳 LINE：「最多只能讓 12%。」',
cards:[['discount','n.','折扣','Can you give us a discount?','可以給我們折扣嗎？'],['in return','phr.','作為交換','In return, we can offer free training.','作為交換，我們可以提供免費訓練。'],['meet halfway','phr.','各退一步、折衷','Let\'s meet halfway at twelve percent.','我們各退一步，12% 吧。'],['offer','v./n.','提供；報價、提議','That\'s a good offer.','那是個好提議。'],['deal','n.','交易、成交','I think we have a deal.','我想我們成交了。']],
qs:[{who:'Linda',en:'Your price is still too high. Can you give us a twenty percent discount?',zh:'你們價格還是太高。可以打八折嗎？',o:[['I understand. Twenty percent is difficult, but we could offer ten percent if you order five units.',1],['OK, twenty percent, no problem!',0,'Wow, that was easy. Can I ask for thirty?'],['No discount. Never. Not even one percent.',0,'Then I guess VisionTek gets the order.']],why:'不要立刻讓步也不要一口回絕。用 could offer… if… 做「條件交換」。',sk:'speak'},
{who:'Linda',en:'What do we get if we sign a two-year contract?',zh:'如果我們簽兩年合約，可以得到什麼？',o:[['In return for a two-year contract, we can include free maintenance.',1],['You get my love.',0,'Sweet, but my boss wants maintenance, not love.'],['Return? You want to return the machine?',0,'No, Henry. "In return" means what we get back.']],why:'In return for…, we can… = 作為…的交換，我們可以…。',sk:'listen'},
{who:'Mike',en:'VisionTek offered free shipping and free training.',zh:'VisionTek 提供免運費和免費訓練。',o:[['That\'s a good offer. But remember, our system is more accurate, so you\'ll spend less on defects.',1],['VisionTek always lies.',0,'Careful. Lawyers love that kind of sentence.'],['Then we give everything free!',0,'Everything free? Your boss just fainted.']],why:'不攻擊對手、也不恐慌降價。先肯定對方，再把焦點拉回自己的價值。',sk:'speak'},
{who:'Linda',en:'Fifteen percent and we have a deal.',zh:'15% 就成交。',o:[['How about we meet halfway? Twelve percent, plus free training for your team.',1],['Let\'s meet at half past.',0,'Half past what? We\'re negotiating, not scheduling lunch!'],['Fifteen is a bad number.',0,'It\'s a great number… for me.']],why:'meet halfway = 各退一步。提出折衷數字再加一點附加價值。',sk:'speak'},
{who:'Mike',en:'Twelve percent with training… okay. I think we can work with that.',zh:'12% 加訓練……好吧。我想可以接受。',o:[['Great! I\'m glad we found a deal that works for both of us.',1],['Yes! I win! You lose!',0,'Wow. Maybe I should call VisionTek after all.'],['Deal or no deal?',0,'It\'s not a TV show, Henry.']],why:'成交時強調雙贏（works for both of us），不要表現得像打贏了。',sk:'speak'}],
ch:{who:'Linda',en:'Give us free shipping, or we walk.',zh:'給我們免運費，不然我們就走人。',task:'不要直接答應，用條件交換回應。',rules:[['\\bif\\b|in return','有條件交換',25],['ship','回應運費',15],['order|contract|units|year','提出條件',20],['understand|appreciate|fair','先表示理解',20],['could|can|would','用委婉語氣',20]],sample:'I understand. We could offer free shipping if you order ten units, or in return for a two-year contract.',sampleZh:'我理解。如果你們訂十台，或作為簽兩年合約的交換，我們可以提供免運費。'}},
{line:'work',bg:'bg_email',title:'工作 4：Email 與訊息攻防',story:'深夜 11 點，Linda 和 Mike 的 email 一封接一封。你的回覆要專業、清楚，還不能有錯字——上次 VisionTek 就是被抓到把客戶名字拼錯。',
cards:[['attached','adj.','附加的（附件）','Please find the quote attached.','附件是報價單，請查收。'],['regarding','prep.','關於','Regarding the delivery, it\'s on schedule.','關於交貨，目前照進度。'],['as discussed','phr.','如先前討論','As discussed, here is the contract.','如先前討論，這是合約。'],['confirm','v.','確認','Can you confirm the date?','你可以確認日期嗎？'],['at your earliest convenience','phr.','在您方便時盡早','Please reply at your earliest convenience.','請您方便時盡早回覆。']],
qs:[{who:'Linda',en:'Hi Henry, could you send me the updated quote?',zh:'Henry 你好，可以寄更新的報價給我嗎？',o:[['Hi Linda, please find the updated quote attached. Let me know if you have any questions.',1],['Here. Quote.',0,'Wow, so warm. Like a robot.'],['Hey babe, the quote is in there lol.',0,'"Babe"? This is a business email, Henry!']],why:'Please find … attached = 附件請查收，正式又友善。',sk:'speak'},
{who:'Mike',en:'When can we have a call regarding the installation?',zh:'什麼時候可以開會討論安裝的事？',o:[['Regarding the installation, I\'m free on Tuesday or Wednesday afternoon. Which works better for you?',1],['Anytime. I have no life.',0,'Too much information, buddy.'],['Regarding call, call me.',0,'Uh… when? That\'s the whole question.']],why:'regarding = 關於。給兩個時段讓對方選，回覆更有效率。',sk:'speak'},
{who:'Linda',en:'As discussed, please confirm the delivery date.',zh:'如先前討論，請確認交貨日期。',o:[['As discussed, I can confirm that the machines will be delivered on June 15.',1],['I confirm maybe June.',0,'"Confirm maybe"? Those words don\'t go together.'],['Yes.',0,'Yes… what? The date, Henry!']],why:'confirm 後面要接明確內容；maybe 和 confirm 互相矛盾。',sk:'speak'},
{who:'Mike',en:'I\'ll review the contract this week.',zh:'我這週會看合約。',o:[['Thanks, Mike. Could you send it back signed at your earliest convenience, ideally by Friday?',1],['Hurry up, please. My boss is angry.',0,'Your boss\'s mood is not my problem.'],['Sign it now now now!',0,'Three "nows"? Very calming.']],why:'at your earliest convenience 是禮貌催促，再加一個理想期限 ideally by Friday。',sk:'speak'}],
ch:{who:'Linda',en:'Henry, why haven\'t the parts arrived yet?',zh:'Henry，為什麼零件還沒到？',task:'寫一兩句 email：道歉、說明新到貨時間、承諾下一步。',rules:[['sorry|apologi','有道歉',20],['delay|late','說明延誤',20],['\\bby\\b|\\bon\\b (monday|tuesday|wednesday|thursday|friday)|\\d','有新時間',20],['will|we\'ll|i\'ll','有承諾',20],['tracking|update|confirm|regarding','有下一步',20]],sample:'Hi Linda, I\'m sorry for the delay. The parts will arrive by Thursday, and I\'ll send you the tracking number today.',sampleZh:'Linda 你好，很抱歉延誤了。零件會在週四前送到，我今天會寄追蹤號碼給你。'}},
{line:'work',bg:'bg_tradeshow',title:'工作 5：德國展覽會跨文化大戰',story:'德國漢諾威工業展。左邊是日本客戶田中先生，右邊是德國工程主管 Weber 女士。VisionTek 的攤位就在隔壁，還在發免費啤酒……',
cards:[['booth','n.','展位、攤位','Please visit our booth.','歡迎來我們的攤位。'],['business card','n.','名片','Here\'s my business card.','這是我的名片。'],['consider','v.','考慮','We will consider your offer.','我們會考慮你的提案。'],['specification','n.','規格','What are the exact specifications?','確切的規格是什麼？'],['straightforward','adj.','直接的、坦率的','To be straightforward, we\'re not the cheapest.','直白地說，我們不是最便宜的。']],
qs:[{who:'Mr. Tanaka',en:'Nice to meet you. This is my business card.',zh:'很高興見到你。這是我的名片。',o:[['(Take it with both hands and read it.) Thank you, Mr. Tanaka. Here\'s mine.',1],['(Put it in your back pocket.) Cool, thanks.',0,'(Mr. Tanaka looks at your back pocket… in silence.)'],['(Write a note on it.) Is this your phone number?',0,'(Mr. Tanaka is speechless. Writing on his card is rude.)']],why:'日本商務禮儀：雙手接名片、仔細看、放在桌上或名片夾，不要直接塞口袋或在上面寫字。',sk:'listen'},
{who:'Mr. Tanaka',en:'Hmm… it is a little difficult. We will consider it.',zh:'嗯……有點困難。我們會考慮。',o:[['Of course. Please take your time. Is there anything I can clarify for you?',1],['Great! So that\'s a yes?',0,'(Mr. Tanaka smiles politely. In Japan, "difficult" often means "no".)'],['Consider fast, please. I fly tomorrow.',0,'(Pressure doesn\'t work here. The room gets colder.)']],why:'日本客戶說 difficult／consider 常是委婉拒絕。不要逼，問他有什麼疑慮。',sk:'listen'},
{who:'Ms. Weber',en:'To be honest, your brochure is too vague. What are the exact specifications?',zh:'老實說，你們的型錄太模糊了。確切規格是什麼？',o:[['Fair point. The accuracy is 0.02 millimeters, and the cycle time is 1.5 seconds per part.',1],['It is very, very good, believe me.',0,'In Germany, "believe me" is not a specification.'],['Specifications are a secret, haha.',0,'Then my budget is also a secret. Goodbye.']],why:'德國客戶重視直接、精確的資料。直接給數字最有說服力。',sk:'speak'},
{who:'Ms. Weber',en:'VisionTek is next door, and they say they\'re cheaper. Be straightforward: why you?',zh:'VisionTek 就在隔壁，他們說比較便宜。直接說：為什麼選你們？',o:[['To be straightforward, we\'re not the cheapest. But our machines have less downtime, so the total cost is lower.',1],['Don\'t go there. Their coffee is bad.',0,'Ha! Their coffee is actually excellent.'],['We are the best in the whole world.',0,'Says every company at this fair.']],why:'面對直接的客戶就直接回答：承認缺點，再講總成本優勢。downtime = 停機時間。',sk:'speak'},
{who:'Mr. Tanaka',en:'We would like to visit your factory in Taiwan before we decide.',zh:'我們想在決定前參觀你們在台灣的工廠。',o:[['That would be an honor. I\'ll arrange a visit for you and your team.',1],['Why? You don\'t trust me?',0,'(Mr. Tanaka looks worried. Visiting is a normal step!)'],['OK, come anytime. No need to tell me.',0,'No plan? Japanese clients love plans.']],why:'參訪工廠是建立信任的正常步驟。That would be an honor 很得體，再主動安排。',sk:'speak'}],
ch:{who:'Ms. Weber',en:'Give me two exact facts about your system. No marketing words.',zh:'給我兩個關於你們系統的確切事實。不要行銷用語。',task:'用兩個具體數字回答（準確度、速度、停機時間等）。',rules:[['\\d','有數字',30],['accura','準確度',20],['second|per hour|downtime|cycle','速度或停機',20],['percent|millimet|\\bmm\\b','有單位',15],['\\band\\b','兩個事實連起來',15]],sample:'Our accuracy is 0.02 millimeters, and the system inspects 2,400 parts per hour with less than one percent downtime.',sampleZh:'我們的準確度是 0.02 毫米，系統每小時檢測 2,400 個零件，停機時間不到 1%。'}},
{line:'life',bg:'bg_hotel',title:'生活 1：飯店入住與客訴',story:'晚上 11 點抵達芝加哥的飯店。你只想洗澡睡覺，但房間的冷氣好像有自己的想法……',
cards:[['reservation','n.','預訂','I have a reservation.','我有預訂。'],['check in','v.','辦理入住','I\'d like to check in, please.','我要辦理入住。'],['front desk','n.','櫃檯','Call the front desk if you need anything.','有需要請打給櫃檯。'],['air conditioner','n.','冷氣機','The air conditioner isn\'t working.','冷氣壞了。'],['complaint','n.','抱怨、客訴','I\'d like to make a complaint.','我想要客訴。']],
qs:[{who:'Receptionist',en:'Good evening, sir. Do you have a reservation?',zh:'先生晚安。請問有預訂嗎？',o:[['Yes, I have a reservation under the name Henry Yeh.',1],['Yes, I reserve myself.',0,'You… reserved yourself? Interesting.'],['No, but I am very tired.',0,'I\'m sorry, sir, "tired" is not a booking.']],why:'under the name … = 以…的名字訂的。',sk:'listen'},
{who:'Receptionist',en:'Could I see your passport and a credit card, please?',zh:'可以看一下您的護照和信用卡嗎？',o:[['Sure, here you go.',1],['Why? Are you the police?',0,'No, sir. Just the front desk.'],['My credit card is in my heart.',0,'Lovely, but our machine can\'t read hearts.']],why:'Here you go 是遞東西給別人時最自然的說法。',sk:'listen'},
{who:'Front desk',en:'Front desk. How can I help you?',zh:'櫃檯您好，有什麼可以幫您？',o:[['Hi, this is room 1208. The air conditioner isn\'t working. Could you send someone to check it?',1],['Your hotel is terrible! I want my money back now!',0,'Whoa, sir, let\'s start with the problem first.'],['Air is no cold. I am die.',0,'Please don\'t die, sir. Let\'s fix the air conditioner.']],why:'客訴三步驟：先說房號、再說問題、最後提要求。isn\'t working = 壞了。',sk:'speak'},
{who:'Front desk',en:'I\'m very sorry. Unfortunately, we can\'t fix it tonight.',zh:'非常抱歉。很遺憾今晚無法修好。',o:[['I see. In that case, could I move to another room?',1],['Then I\'ll sleep in the lobby.',0,'Please don\'t, sir. The lobby has cameras.'],['Fix it tonight or I post on Instagram!',0,'Threats before solutions? Not a good look.']],why:'In that case, could I…? 提出合理的替代方案（換房）。',sk:'speak'}],
ch:{who:'Front desk',en:'Front desk. How can I help you?',zh:'櫃檯您好，有什麼可以幫您？',task:'抱怨房間太吵，並提出要求。',rules:[['room \\d|this is room|my room','說房號或房間',20],['noisy|noise|loud','說明問題',20],['could|can|would','禮貌請求',20],['another room|move|change|quieter','提出解法',25],['please|thank','有禮貌',15]],sample:'Hi, this is room 1208. My room is very noisy because of the construction. Could I move to a quieter room, please?',sampleZh:'你好，這裡是 1208 號房。因為施工，我的房間很吵。可以換到安靜一點的房間嗎？'}},
{line:'life',bg:'bg_restaurant',title:'生活 2：餐廳點餐、過敏與買單',story:'和美國朋友 Jake 在牛排館吃飯。菜單上一堆看不懂的字，而你對花生過敏——這頓飯可不能出事。',
cards:[['order','v.','點餐；訂購','Are you ready to order?','準備好點餐了嗎？'],['medium-rare','adj.','三分熟','I\'d like my steak medium-rare.','我的牛排要三分熟。'],['allergic','adj.','過敏的','I\'m allergic to peanuts.','我對花生過敏。'],['check','n.','（美）帳單','Could we get the check, please?','可以給我們帳單嗎？'],['split the bill','phr.','平分帳單','Let\'s split the bill.','我們平分吧。']],
qs:[{who:'Waiter',en:'Hi there! Are you ready to order?',zh:'你好！準備好點餐了嗎？',o:[['Almost. What do you recommend?',1],['I am ready. Are you ready?',0,'I was born ready, sir. What would you like?'],['Give me food.',0,'Any particular food, or just… food?']],why:'What do you recommend? 請服務生推薦，很自然。',sk:'listen'},
{who:'Waiter',en:'How would you like your steak?',zh:'您的牛排要幾分熟？',o:[['Medium-rare, please.',1],['I like it very much.',0,'Great! But I meant how cooked.'],['Cooked, please.',0,'Good choice. We usually cook them.']],why:'How would you like your steak? 問的是熟度：rare／medium-rare／medium／well-done。',sk:'listen'},
{who:'Waiter',en:'The salad comes with peanut sauce.',zh:'沙拉附花生醬。',o:[['Oh, I\'m allergic to peanuts. Could I have it without the sauce?',1],['I am allergy peanut.',0,'Close! It\'s "I\'m allergic to peanuts."'],['Peanuts are my enemy.',0,'Dramatic! But do you want it without peanuts?']],why:'過敏說 I\'m allergic to + 名詞。without the sauce = 不要醬。',sk:'speak'},
{who:'Jake',en:'Dinner was great. Should we split the bill?',zh:'晚餐很棒。我們要平分帳單嗎？',o:[['Sure, let\'s split it. Excuse me, could we get the check, please?',1],['I split you, you split me.',0,'That sounds like a fight, not a bill.'],['The check is good, thanks.',0,'The check isn\'t good or bad. It\'s the bill!']],why:'split the bill = 平分帳單。在美國買單說 Could we get the check, please?',sk:'speak'}],
ch:{who:'Waiter',en:'Do you have any allergies or special requests?',zh:'您有任何過敏或特殊需求嗎？',task:'說出你的過敏，並要求調整餐點。',rules:[['allergic','用 allergic',25],['allergic to \\w+','allergic to＋食物',20],['without|\\bno\\b','提出調整',20],['could|can|would','禮貌請求',20],['please','說 please',15]],sample:'Yes, I\'m allergic to shrimp. Could I have the pasta without shrimp, please?',sampleZh:'有，我對蝦子過敏。義大利麵可以不要加蝦嗎？'}},

const XB=5;
function TL(){return ST.life?'自信':'信任'}
function nx(){if(ST.x==null)return next();const c=X[ST.x];ST.qi++;if(ST.qi<c.qs.length)return xAsk();xChal()}
function startX(j){unlockSpeech();stopSay();const c=X[j];Object.assign(ST,{mode:'single',ch:XB+j,x:j,life:c.line==='life',si:0,qi:0,cc:0,trust:50,speak:0,listen:0,xp:0,streak:0,wrong:[],learned:[],vocab:0,boss:0,chs:0});setBg(c.bg);
 view(`<div class="card"><div class="tag">${c.line==='work'?'💼 工作線':'🏠 生活線'}・第 ${XB+j+1} 章</div><h2>${c.title}</h2><p>${c.story}</p><p class="small">${ST.life?'本章用「自信」代替客戶信任。':''}共 ${c.qs.length} 題＋1 個打字挑戰。</p><button class="btn" onclick="xAsk()">開始</button></div>`)}
function xAsk(){const c=X[ST.x],q=c.qs[ST.qi];view(qHtml(q,`${c.title}・第 ${ST.qi+1}／${c.qs.length} 題`));renderOpts(q,(ok,o)=>answer(q,ok,o));autoSay(q.en)}
function xChal(){const c=X[ST.x],B=c.ch;view(`<div class="card boss"><div class="tag">✍️ 打字小挑戰</div><div class="who">${B.who}：</div><div class="en">${wz(B.en)}</div><div class="row"><button class="sm" onclick='say(${sq(B.en)})'>🔊 朗讀</button><span class="zh">${B.zh}</span></div><p class="small">任務：${B.task}</p><textarea id="ans" rows="4" placeholder="用英文打一兩句…"></textarea><button class="btn" id="xsend" onclick="xJudge()">送出</button><div id="fb"></div></div>`);autoSay(B.en)}
function xJudge(){const c=X[ST.x],B=c.ch,t=$('#ans').value;if(t.trim().length<3){toast('先打一句英文喔！');return}const r=scoreBoss(t,B);ST.chs=r.sc;ST.trust+=Math.round(r.sc/10)-2;ST.speak+=r.sc>=60?2:1;ST.xp+=r.sc;
 $('#fb').innerHTML=`<div class="fb ${r.sc>=60?'ok':'no'}">挑戰分數：<b>${r.sc}</b>／100<br>✔ ${r.hit.join('、')||'（無）'}<br>✘ 可以加強：${r.miss.join('、')||'（無）'}</div><div class="vc"><b>範例好答案</b> <button class="sm" onclick='say(${sq(B.sample)})'>🔊</button><div>${wz(B.sample)}</div><div class="small">${B.sampleZh}</div></div><button class="btn" onclick="xCards()">領取單字卡</button>`;$('#ans').disabled=true;$('#xsend').disabled=true;hud()}
function xCards(){const c=X[ST.x];c.cards.forEach(k=>{if(!ST.learned.find(x=>x[0]===k[0]))ST.learned.push(k)});ST.vocab=ST.learned.length;ST.xp+=20;stopSay();
 view(`<div class="card"><h2>🎴 獲得單字卡 ×${c.cards.length}</h2>${c.cards.map(cardHtml).join('')}<button class="btn" onclick="xEnd()">完成本章</button></div>`)}
function xEnd(){const j=ST.x,c=X[j],sc=Math.round((ST.cc||0)/c.qs.length*70+ST.chs*0.3);setBest(XB+j,sc);save();
 const tier=ST.trust>=75?(ST.life?'😎 自信爆棚！外國人都以為你住美國很久了。':'🏆 客戶超滿意，VisionTek 只能在旁邊乾瞪眼。'):ST.trust>=55?(ST.life?'🙂 順利過關，有點小尷尬但沒出包。':'📦 客戶還算滿意，但 VisionTek 仍虎視眈眈。'):(ST.life?'😅 今天有點狼狽……多練幾次就好！':'💨 客戶皺眉了，VisionTek 趁機補位……');
 const nxt=X[j+1]&&X[j+1].line===c.line;
 view(`<div class="card"><h2>📝 本章完成：${c.title}</h2><p>${tier}</p><div class="stats"><div>${ST.life?'💪 自信':'🤝 信任'} <b>${ST.trust}</b></div><div>答對 <b>${ST.cc||0}／${c.qs.length}</b>　挑戰 <b>${ST.chs}</b> 分</div><div>本章分數 <b>${sc}</b>（最佳 ${bests()[XB+j]}）</div><div>⭐ XP <b>${ST.xp}</b>　🔥 最高連勝 <b>${ST.best}</b></div></div><p class="small">答錯的題目已存成「回頭客」，會在主線結尾的複習回合出現。</p>${nxt?`<button class="btn" onclick="startX(${j+1})">繼續下一章 ▶</button>`:''}<button class="btn" onclick="menu()">回章節選單</button></div>`)}
function chapterList(){const b=bests();const it=(i,n)=>`<div class="opt chap" role="button" onclick="startChapter(${i},'single')">${i in b?'✅':'⬜'} 第 ${i+1} 章：${n}${i in b?`<span class="small">　最佳 ${b[i]} 分</span>`:''}</div>`;
 return `<h4>💼 工作</h4><p class="small">主線（第 1–5 章）＋進階工作（第 6–10 章）</p>${CHN.map((n,i)=>it(i,n)).join('')}${X.map((c,j)=>c.line==='work'?it(XB+j,c.title.replace(/^工作 \d：/,'')):'').join('')}<h4>🏠 生活</h4>${X.map((c,j)=>c.line==='life'?it(XB+j,c.title.replace(/^生活 \d：/,'')):'').join('')}`}

ch:{who:"Sarah",en:"Do you have any questions for me before we finish?",zh:"結束前你還有問題想問我嗎？",task:"問 Sarah 一個關於她經驗或強項的問題，並說明你會何時回覆她。",rules:[["experience|strength|example|deal|client","問到經驗／強項／例子",25],["\\?","有問句",20],["get back to you|let you know|contact you|hear from us","說會回覆",25],["friday|monday|tuesday|wednesday|thursday|week|\\d","有明確時間",15],["thank","有道謝",15]],sample:"Yes, one more question: could you give me an example of a difficult client you won back? Thank you for your time. We'll get back to you by Friday.",sampleZh:"有，再一個問題：你能舉一個你挽回難搞客戶的例子嗎？謝謝你的時間，我們週五前會回覆你。"}},
{line:'work',bg:'bg_demo',title:"工作 7：業績報告與圖表",story:"季度會議上，美國總部的 VP Karen 要你用英文報告亞洲區業績。投影片上的折線圖有升有降，你得說清楚原因。",
cards:[["revenue","n.","營收","Revenue grew by twelve percent.","營收成長了 12%。"],["increase","v./n.","增加","Sales increased sharply in March.","三月業績大幅增加。"],["decline","v./n.","下降","Orders declined slightly in Q2.","第二季訂單微幅下降。"],["compared to","phr.","和…相比","Compared to last year, we're up ten percent.","和去年相比我們成長了一成。"],["forecast","n./v.","預測","Our forecast for Q4 is positive.","我們對第四季的預測是正向的。"]],
qs:[{who:"Karen",en:"Henry, can you walk us through the numbers for Asia?",zh:"Henry，可以帶我們看一下亞洲區的數字嗎？",o:[["Sure. As you can see on this chart, revenue grew by twelve percent this quarter.",1],["Numbers are on the slide. You can read.",0,"Thanks… I guess I'll read it myself then."],["Asia is big. Many numbers.",0,"Very true, but not very helpful."]],why:"As you can see on this chart… 是報告圖表的標準開頭，然後給一個關鍵數字。",sk:"speak"},
{who:"Karen",en:"What happened in May? The line drops quite a lot.",zh:"五月怎麼了？那條線掉很多。",o:[["Orders declined in May because one big client delayed their project. It recovered in June.",1],["The line is tired in May.",0,"Ha! Lines don't get tired, Henry."],["I don't know. It just happened.",0,"\"It just happened\" is not an explanation I can take to the CEO."]],why:"說明下降：declined…because…，再補一句 It recovered（已回升），讓老闆安心。",sk:"speak"},
{who:"Karen",en:"How does that compare to last year?",zh:"和去年比起來怎麼樣？",o:[["Compared to last year, we're up about ten percent overall.",1],["Last year is last year.",0,"Deep. But I need a comparison."],["It is more higher than last year.",0,"\"More higher\" is a double comparative; just say \"higher\"."]],why:"compared to last year + up/down + 百分比。不要說 more higher。",sk:"listen"},
{who:"Karen",en:"What's your forecast for the next quarter?",zh:"你對下一季的預測是什麼？",o:[["We forecast steady growth, around eight percent, if the two new deals close.",1],["I am not a fortune teller.",0,"No, but you are the regional sales lead…"],["Very good. Trust me.",0,"I trust data more than feelings."]],why:"forecast 要給數字和前提：if the two new deals close。",sk:"speak"},
{who:"Karen",en:"Great job. Could you send me the slides after the meeting?",zh:"做得好。會後可以把投影片寄給我嗎？",o:[["Absolutely. I'll send them to you this afternoon.",1],["Slides are private.",0,"Private? I'm your VP."],["Yes, I send you yesterday.",0,"Yesterday? Time travel? \"I'll send them this afternoon\" works better."]],why:"Absolutely. I'll send them… 給明確時間。",sk:"listen"}],
ch:{who:"Karen",en:"In one or two sentences, summarize the quarter for our CEO.",zh:"用一兩句話向 CEO 總結這一季。",task:"說出營收變化（含百分比）、一個原因、以及下一季預測。",rules:[["revenue|sales|orders","提到營收／業績",20],["\\d+ ?(%|percent)","有百分比",20],["increase|grew|grow|up|decline|drop|down","描述升降",20],["because|due to|thanks to","說明原因",20],["forecast|next quarter|expect","下一季預測",20]],sample:"Revenue increased by twelve percent this quarter, mainly because of two new clients in Vietnam. We forecast eight percent growth next quarter.",sampleZh:"本季營收成長 12%，主要因為越南兩個新客戶。我們預測下一季成長 8%。"}},
{line:'work',bg:'bg_call',title:"工作 8：客訴電話處理",story:"早上八點，美國客戶 Dave 打電話來，語氣很火：「你們的機器又停機了！」產線停一小時就是好幾萬美金，這通電話處理不好，訂單就飛了。",
cards:[["apologize","v.","道歉","I apologize for the inconvenience.","造成不便，我深感抱歉。"],["inconvenience","n.","不便","Sorry for any inconvenience.","造成任何不便請見諒。"],["look into","phr.","調查、了解","I'll look into it right away.","我馬上去了解。"],["replacement","n.","替換品","We'll ship a replacement part today.","我們今天寄出替換零件。"],["make it up to you","phr.","彌補你","Let us make it up to you.","讓我們彌補你。"]],
qs:[{who:"Dave",en:"Henry, your machine stopped again! This is the second time this week!",zh:"Henry，你們的機器又停了！這週第二次了！",o:[["I'm really sorry, Dave. I understand how frustrating this is. Let me help you right now.",1],["Calm down. Machines stop sometimes.",0,"\"Calm down\"?! That makes me MORE angry!"],["It's not my fault. Maybe your workers.",0,"Blaming my team? Great way to lose a client."]],why:"客訴第一步：道歉＋同理（I understand how frustrating this is），不要叫人冷靜或推卸責任。",sk:"speak"},
{who:"Dave",en:"The screen shows error code E-forty-two. What does that mean?",zh:"螢幕顯示錯誤碼 E42，是什麼意思？",o:[["E-42 is usually a camera sensor issue. I'll look into it with our engineers right away.",1],["E-42 means error.",0,"Yes, I can see it's an ERROR, Henry."],["Turn it off and on. Bye.",0,"Did you just hang up on me?!"]],why:"look into = 調查了解。先給初步判斷，再承諾行動。",sk:"listen"},
{who:"Dave",en:"How soon can you fix it? We're losing money every hour.",zh:"多快能修好？我們每小時都在虧錢。",o:[["We'll ship a replacement sensor today, and an engineer can be there by tomorrow morning.",1],["Maybe next month.",0,"Next month?! We'll be bankrupt by then."],["Soon. Very soon. Don't worry.",0,"\"Soon\" isn't a time, Henry."]],why:"給具體方案：replacement（替換品）＋明確時間 by tomorrow morning。",sk:"speak"},
{who:"Dave",en:"This is really hurting our trust in your company.",zh:"這真的傷害我們對你們公司的信任。",o:[["I completely understand. To make it up to you, we'll extend your warranty by six months.",1],["Trust is your problem.",0,"No, Henry. It's YOUR problem now."],["Our company is very good, you should trust.",0,"Saying it doesn't make it true."]],why:"make it up to you = 補償你。用具體補償（延長保固）重建信任。",sk:"speak"},
{who:"Dave",en:"Okay. Keep me updated, please.",zh:"好吧。請隨時告訴我進度。",o:[["Of course. I'll call you every four hours until it's fixed. Again, I apologize for the inconvenience.",1],["Okay. Bye.",0,"That's it? Not very reassuring."],["You also keep me updated.",0,"I'm the one with the broken machine…"]],why:"承諾回報頻率，再正式道歉一次：I apologize for the inconvenience。",sk:"listen"}],
ch:{who:"Dave",en:"Give me one good reason why I shouldn't switch to VisionTek.",zh:"給我一個不換成 VisionTek 的好理由。",task:"道歉、說明解決方案和時間，並提出一個補償。",rules:[["sorry|apologi","有道歉",20],["replace|engineer|fix|repair","說明解決方案",20],["today|tomorrow|hour|\\d","有明確時間",20],["warranty|discount|free|make it up","提出補償",20],["understand|trust|frustrat","展現同理",20]],sample:"I completely understand, and I apologize again. We'll replace the sensor today, our engineer will be there tomorrow morning, and to make it up to you, we'll add six months of free warranty.",sampleZh:"我完全理解，再次致歉。我們今天更換感測器，工程師明早到，為了補償，我們再加送六個月保固。"}},
{line:'work',bg:'bg_factory',title:"工作 9：供應商稽核",story:"歐洲大客戶的品保經理 Anna 來台灣稽核你們工廠。她拿著一張長長的檢查表，表情嚴肅。過了這關，才能成為正式供應商。",
cards:[["audit","n./v.","稽核、審計","The audit starts at nine.","稽核九點開始。"],["procedure","n.","程序、流程","Can you show me your inspection procedure?","可以給我看你們的檢驗流程嗎？"],["record","n.","紀錄","We keep records for five years.","我們保存紀錄五年。"],["corrective action","n.","矯正措施","We took corrective action immediately.","我們立即採取了矯正措施。"],["comply with","phr.","符合、遵守","We comply with ISO 9001.","我們符合 ISO 9001。"]],
qs:[{who:"Anna",en:"Good morning. Shall we start with a short tour of the production line?",zh:"早安。我們先簡單參觀產線好嗎？",o:[["Good morning, Anna. Sure, this way, please. Here are your safety glasses.",1],["Production line is secret. No photos, no tour.",0,"Then how exactly do you expect me to audit you?"],["Tour later. Lunch first.",0,"It's 9 a.m., Henry."]],why:"This way, please. 帶路的禮貌說法，並主動提供安全裝備，展現專業。",sk:"speak"},
{who:"Anna",en:"Can you show me your incoming inspection procedure?",zh:"可以給我看你們的進料檢驗程序嗎？",o:[["Of course. Every batch is checked against this procedure, and we keep the records for five years.",1],["We check with our eyes. Very careful eyes.",0,"\"Careful eyes\" are not a procedure."],["Procedure? We trust our suppliers.",0,"That's exactly what an audit is for…"]],why:"procedure（程序）＋records（紀錄）是稽核關鍵字。說明怎麼做、保存多久。",sk:"listen"},
{who:"Anna",en:"I see a defect rate spike in March. What happened?",zh:"我看到三月不良率突然上升。發生什麼事？",o:[["A supplier sent us a bad batch. We found the root cause and took corrective action within a week.",1],["March is a bad month. Many holidays.",0,"Holidays don't cause defects, Henry."],["What spike? I don't see it.",0,"It's right here, in red. Very visible."]],why:"稽核問題要誠實：說原因（root cause）＋已採取 corrective action（矯正措施）＋時間。",sk:"speak"},
{who:"Anna",en:"Do you comply with the EU RoHS regulations?",zh:"你們符合歐盟 RoHS 法規嗎？",o:[["Yes, all our products comply with RoHS. I can send you the certificates today.",1],["Yes, maybe. What is RoHS?",0,"\"Maybe\" and \"what is it\" in the same answer? Worrying."],["Rules are for big companies.",0,"We ARE a big company. That's why I'm here."]],why:"comply with = 符合法規。主動提供證書（certificates）。",sk:"listen"},
{who:"Anna",en:"Overall, it looks good. I have two minor findings.",zh:"整體看起來不錯。我有兩個小缺失。",o:[["Thank you. Could you share the details? We'll send you a corrective action plan by next Friday.",1],["Minor? Then we can ignore them.",0,"No, minor still means fix them."],["Two? Why not zero? We are perfect.",0,"Nobody is perfect, Henry. Not even you."]],why:"接受建議並承諾期限：corrective action plan by next Friday。",sk:"speak"}],
ch:{who:"Anna",en:"Before I leave, explain how you will prevent the March problem from happening again.",zh:"我離開前，說明你們如何防止三月的問題再發生。",task:"說明原因、矯正措施、以及預防方法（例如檢驗或紀錄）。",rules:[["supplier|batch|root cause|cause","說明原因",20],["corrective action|fix|changed|replace","矯正措施",20],["inspect|check|test|audit","加強檢驗",20],["record|procedure|report","提到紀錄／程序",20],["will|from now on|every","說明未來做法",20]],sample:"The root cause was a bad batch from one supplier. We took corrective action, and from now on we will inspect every batch and keep a record of each test.",sampleZh:"根本原因是某供應商的一批不良品。我們已採取矯正措施，從現在起每批都檢驗，並記錄每次測試。"}},
{line:'work',bg:'bg_sign',title:"工作 10：合約條款確認",story:"終於要簽約了！客戶的法務 Mr. Brown 一條一條確認條款：付款、交期、保固、罰則。一個字看錯，可能損失上百萬。",
cards:[["terms","n.","條款、條件","Let's go over the terms.","我們來確認條款。"],["payment terms","n.","付款條件","Our payment terms are 30 days.","我們的付款條件是 30 天。"],["penalty","n.","罰則、違約金","There's a penalty for late delivery.","延遲交貨有罰則。"],["warranty","n.","保固","The warranty covers two years.","保固兩年。"],["sign off on","phr.","核准、簽核","My boss needs to sign off on this.","我老闆要簽核這個。"]],
qs:[{who:"Mr. Brown",en:"Let's go over the terms one by one, starting with payment.",zh:"我們一條條確認條款，從付款開始。",o:[["Sure. Our standard payment terms are thirty percent upfront and seventy percent on delivery.",1],["Pay us all now, please.",0,"All now? That's not how contracts work."],["Payment is easy. You pay, we smile.",0,"Cute, but I need percentages."]],why:"payment terms 說清楚比例和時間點：upfront（預付）／on delivery（交貨時）。",sk:"speak"},
{who:"Mr. Brown",en:"What happens if you deliver late?",zh:"如果你們延遲交貨會怎樣？",o:[["There's a penalty of half a percent per week, up to five percent of the contract value.",1],["We are never late.",0,"Never? Then you won't mind a penalty clause."],["Then you wait longer.",0,"That's… not a legal answer."]],why:"penalty（罰則）要說清楚計算方式與上限 up to…。",sk:"listen"},
{who:"Mr. Brown",en:"Does the warranty include parts and labor?",zh:"保固包含零件和人工嗎？",o:[["Yes, the warranty covers parts and labor for two years, but not damage caused by misuse.",1],["Warranty includes everything forever.",0,"Forever? Your lawyer would faint."],["Labor? Our workers are not for sale.",0,"Labor means the work of repairs, Henry."]],why:"說明範圍與例外：covers… but not…。labor 在這裡指維修工時。",sk:"listen"},
{who:"Mr. Brown",en:"Can we change the delivery date to the end of July?",zh:"交期可以改到七月底嗎？",o:[["That should work, but I need to check with our factory. Can I confirm by tomorrow?",1],["Yes, yes, any date.",0,"Any date? Let me write that in the contract…"],["No. Contract is contract.",0,"We haven't signed it yet, Henry."]],why:"不要當場答應做不到的事：That should work, but I need to check… 再給回覆時間。",sk:"speak"},
{who:"Mr. Brown",en:"Good. Once your manager signs off on it, we can sign.",zh:"好。等你們經理核准，我們就可以簽約。",o:[["Great. I'll get it signed off today and send you the final version.",1],["My manager signs off at 6 p.m. He goes home.",0,"Ha, \"sign off\" here means approve, not leave work!"],["Why do we need my manager? I am the boss.",0,"Then why did you just say you need approval?"]],why:"sign off on = 核准、簽核，不是下班。",sk:"listen"}],
ch:{who:"Mr. Brown",en:"Please summarize the key terms we agreed on today.",zh:"請總結今天我們同意的主要條款。",task:"總結付款條件、交期、保固，並說明下一步。",rules:[["payment|upfront|pay","付款條件",20],["deliver|july|date","交期",20],["warranty|two years|2 years","保固",20],["\\d","有數字",20],["sign|send|next step|confirm","下一步",20]],sample:"To summarize: payment is thirty percent upfront and seventy percent on delivery, delivery is by the end of July, and the warranty covers two years. I'll send you the final contract to sign today.",sampleZh:"總結：付款三成預付、七成交貨時付；七月底前交貨；保固兩年。我今天會寄最終合約給你簽。"}},
{line:'life',bg:'bg_carrental',title:"生活 6：租車與問路",story:"在洛杉磯機場租車，準備自己開去客戶工廠。櫃檯人員一直推銷保險，導航又沒訊號……",
cards:[["rent a car","phr.","租車","I'd like to rent a car for three days.","我想租車三天。"],["insurance","n.","保險","Is insurance included?","有含保險嗎？"],["fill up","phr.","加滿（油）","Please fill up the tank before returning.","還車前請加滿油。"],["turn left","phr.","左轉","Turn left at the second light.","第二個紅綠燈左轉。"],["how far","phr.","多遠","How far is it from here?","從這裡過去多遠？"]],
qs:[{who:"Agent",en:"Hi, do you have a reservation?",zh:"嗨，您有預約嗎？",o:[["Yes, under Henry Yeh. A compact car for three days.",1],["Yes, I reserve.",0,"Okay… under what name?"],["Reservation for what?",0,"For the car? This is a car rental counter, sir."]],why:"under + 名字 = 用某人名字預約。順便說車型和天數。",sk:"listen"},
{who:"Agent",en:"Would you like to add full insurance for twenty-five dollars a day?",zh:"要不要加全險，一天 25 美元？",o:[["What does it cover? Is basic insurance already included?",1],["Yes, give me everything.",0,"Great! That's an extra $200. Thank you!"],["Insurance is for weak people.",0,"Tell that to the guy who hit a deer last week."]],why:"先問 What does it cover? 和是否已含基本險，避免被推銷多付錢。",sk:"speak"},
{who:"Agent",en:"Please fill up the tank before you return it, or we'll charge you a fee.",zh:"還車前請加滿油，否則會收費。",o:[["Got it. Is there a gas station near the airport?",1],["Fill up what? My stomach?",0,"The gas tank, sir."],["I return empty, no problem.",0,"No problem for us. We'll charge you $9 a gallon."]],why:"fill up the tank = 加滿油。順便問最近的加油站（gas station）。",sk:"listen"},
{who:"Local",en:"Go straight for two blocks, then turn left at the second light.",zh:"直走兩個路口，然後在第二個紅綠燈左轉。",o:[["So, two blocks straight, then left at the second light. Thanks!",1],["Two lights left blocks?",0,"Uh… let me say it again, slowly."],["Okay, turn right.",0,"LEFT, buddy. Left!"]],why:"問路後複述一次確認（So, …），最不容易走錯。",sk:"listen"},
{who:"Local",en:"Anything else I can help you with?",zh:"還有什麼可以幫忙的嗎？",o:[["How far is it from here? Can I walk, or should I drive?",1],["You can drive me there.",0,"Ha, I'm not an Uber, my friend."],["No. You talk too fast.",0,"Sorry… I'll leave you alone then."]],why:"How far is it from here? 問距離，再問交通方式。",sk:"speak"}],
ch:{who:"Agent",en:"Okay, anything else before I give you the keys?",zh:"好，給你鑰匙前還有其他問題嗎？",task:"問一個關於保險或還車（加油、時間）的問題，並問怎麼去某地。",rules:[["insurance|cover|fill up|gas|return","問保險／還車",25],["\\?","有問句",20],["how (do|can) i get|how far|where is|directions","問路",25],["please|thank|could","有禮貌",15],["\\b(car|tank|airport|highway)\\b","具體名詞",15]],sample:"Yes, could you tell me what time I need to return the car, and do I need to fill up the tank? Also, how do I get to the highway from here? Thanks!",sampleZh:"有，請問幾點要還車、需要加滿油嗎？還有，從這裡怎麼上高速公路？謝謝！"}},
{line:'life',bg:'bg_mall',title:"生活 7：購物與退貨",story:"在美國百貨幫太太買外套，回飯店才發現尺寸不對，標籤還在。明天就要回台灣了，得趕快去退換。",
cards:[["try on","phr.","試穿","Can I try this on?","我可以試穿嗎？"],["size","n.","尺寸","Do you have this in a smaller size?","這件有小一號的嗎？"],["receipt","n.","收據","Do you have the receipt?","您有收據嗎？"],["refund","n./v.","退款","I'd like a refund, please.","我想退款。"],["exchange","v./n.","換貨","Can I exchange it for a medium?","可以換成 M 號嗎？"]],
qs:[{who:"Clerk",en:"Hi there! Are you looking for anything special today?",zh:"嗨！今天在找什麼特別的嗎？",o:[["I'm looking for a jacket for my wife. Something warm, maybe in dark blue.",1],["I'm just looking at you.",0,"…Okay, that's a little creepy."],["Special? No. Normal things.",0,"Alright, let me know if you need help, I guess."]],why:"I'm looking for… 說明需求，加上顏色等細節，店員才能幫你。",sk:"speak"},
{who:"Clerk",en:"Would you like to try it on? The fitting room is over there.",zh:"要試穿嗎？試衣間在那邊。",o:[["It's for my wife, but thanks. Do you have this in a size small?",1],["I try on my wife.",0,"Hmm, I think you mean you're buying it FOR your wife!"],["No, I trust the jacket.",0,"Ha, bold. Okay!"]],why:"try on = 試穿。Do you have this in a size…? 問尺寸。",sk:"listen"},
{who:"Clerk",en:"Hi again! What can I do for you?",zh:"又見面了！需要什麼幫忙？",o:[["I bought this yesterday, but it's the wrong size. Could I exchange it for a medium?",1],["Your jacket is wrong. Fix it.",0,"The jacket is fine. Maybe the size was the problem?"],["Give me money back now.",0,"I can help, but please ask nicely."]],why:"說明情況（wrong size）再提出要求 exchange it for…，客氣又清楚。",sk:"speak"},
{who:"Clerk",en:"Sure. Do you have the receipt with you?",zh:"沒問題。收據有帶嗎？",o:[["Yes, here it is. The tags are still on.",1],["Receipt? I ate it.",0,"I… hope that's a joke."],["No receipt, but trust me.",0,"Sorry, our policy requires a receipt."]],why:"receipt = 收據。補一句 The tags are still on（吊牌還在），退換更順利。",sk:"listen"},
{who:"Clerk",en:"We're out of mediums. Would you prefer store credit or a refund?",zh:"M 號沒貨了。你要店內抵用金還是退款？",o:[["I'm flying home tomorrow, so I'd prefer a refund to my credit card, please.",1],["Both, please.",0,"Nice try!"],["What is store credit? Is it food?",0,"No, it's money you can only use in our store."]],why:"I'd prefer… 表達偏好，加理由（明天回國）。store credit = 店內抵用金。",sk:"speak"}],
ch:{who:"Clerk",en:"How can I help you with this item?",zh:"這件商品需要什麼協助？",task:"說明你何時買的、問題是什麼，並要求換貨或退款。",rules:[["bought|purchased|yesterday","說明購買時間",20],["size|wrong|broken|damaged|doesn'?t fit","說明問題",20],["exchange|refund|return","要求退換",25],["receipt|tag","提到收據／吊牌",15],["please|could|would","有禮貌",20]],sample:"I bought this jacket yesterday, but it's the wrong size. Here's the receipt. Could I exchange it for a medium, or get a refund, please?",sampleZh:"這件外套我昨天買的，但尺寸不對。這是收據。可以換 M 號或退款嗎？"}},
{line:'life',bg:'bg_baggage',title:"生活 8：班機延誤與行李遺失",story:"芝加哥大雪，班機延誤四小時。好不容易到了，行李轉盤轉到最後——你的行李箱沒出現。裡面有明天要穿的西裝。",
cards:[["delayed","adj.","延誤的","Our flight is delayed by four hours.","我們的班機延誤四小時。"],["baggage claim","n.","行李提領處","Let's meet at baggage claim.","我們在行李提領處見。"],["missing","adj.","遺失的、不見的","My suitcase is missing.","我的行李箱不見了。"],["compensation","n.","賠償","Am I entitled to compensation?","我有權得到賠償嗎？"],["deliver","v.","送達","Can you deliver it to my hotel?","可以送到我的飯店嗎？"]],
qs:[{who:"Gate agent",en:"Due to the snowstorm, flight 882 is delayed by four hours.",zh:"由於暴風雪，882 航班延誤四小時。",o:[["Four hours? I have a meeting tonight. Is there an earlier flight I can switch to?",1],["Why snow? Stop the snow.",0,"I wish I could, sir."],["Okay. I sleep here.",0,"You might, actually."]],why:"表達影響（I have a meeting）再問替代方案 Is there an earlier flight…?",sk:"listen"},
{who:"Gate agent",en:"I'm afraid all earlier flights are full. Here's a meal voucher.",zh:"恐怕更早的班機都滿了。這是餐券。",o:[["Thank you. Could you put me on standby, just in case?",1],["A voucher? I want a hotel and a car and money.",0,"Let's start with the voucher, sir."],["I'm afraid too.",0,"Ha, \"I'm afraid\" here just means \"sorry to say\"."]],why:"I'm afraid… = 很抱歉（委婉）。standby = 候補。",sk:"listen"},
{who:"Staff",en:"Hello, this is the lost baggage desk. How can I help?",zh:"你好，這裡是遺失行李櫃檯。需要什麼協助？",o:[["Hi, my suitcase is missing. I waited at baggage claim, but it never came out.",1],["Where is my bag? You took it.",0,"I didn't take anything, sir. Let me check."],["Bag. Black. Big. Gone.",0,"Okay… I'll need a bit more than that."]],why:"missing = 遺失。說明你已在 baggage claim 等過。",sk:"speak"},
{who:"Staff",en:"Can you describe your bag?",zh:"可以描述一下你的行李嗎？",o:[["It's a large black hard-shell suitcase with a red tag that says Henry Yeh.",1],["It's a normal bag.",0,"We have about five hundred normal bags."],["It's very beautiful.",0,"I'm sure it is, but that won't help me find it."]],why:"描述順序：大小＋顏色＋材質＋特徵（red tag）。",sk:"speak"},
{who:"Staff",en:"We've found it. It's still in Denver. It'll arrive on the next flight.",zh:"找到了，還在丹佛，會搭下一班飛機到。",o:[["That's a relief. Could you deliver it to my hotel tonight? I need my suit for tomorrow.",1],["Denver? Why my bag goes on vacation?",0,"Ha, it does happen…"],["I go to Denver to get it.",0,"Please don't. We'll bring it to you."]],why:"Could you deliver it to…? 請航空公司送到飯店，並說明急迫原因。",sk:"speak"}],
ch:{who:"Staff",en:"Is there anything else you need while you wait for your bag?",zh:"等行李期間還需要什麼嗎？",task:"請對方把行李送到飯店、問有沒有補償或必需品費用。",rules:[["deliver|send|bring","要求送達",25],["hotel","提到飯店",15],["compensation|refund|reimburse|cover|pay for","問賠償",25],["tonight|tomorrow|morning|\\d","有時間",15],["could|please|would","有禮貌",20]],sample:"Yes, could you deliver my suitcase to my hotel tonight? Also, will the airline cover the cost of a shirt and toothbrush? Is there any compensation for the delay?",sampleZh:"有，可以今晚把行李送到飯店嗎？另外，航空公司會負擔襯衫和牙刷的費用嗎？延誤有賠償嗎？"}},
{line:'life',bg:'bg_bar',title:"生活 9：UFC 觀賽閒聊",story:"Mike 約你在運動酒吧看 UFC 大賽，旁邊坐著他的朋友們。這是打入他們圈子的好機會——但他們講話很快，還一堆格鬥術語。",
cards:[["main event","n.","主賽、壓軸戰","The main event starts at ten.","主賽十點開始。"],["underdog","n.","不被看好的一方","I'm rooting for the underdog.","我支持不被看好的那一方。"],["submission","n.","降服（使對手拍地認輸）","He won by submission.","他以降服技獲勝。"],["root for","phr.","替…加油","Who are you rooting for?","你支持誰？"],["rematch","n.","再戰","They need a rematch.","他們需要再打一場。"]],
qs:[{who:"Jake",en:"Hey, Henry! Who are you rooting for in the main event?",zh:"嘿，Henry！主賽你支持誰？",o:[["I'm rooting for the underdog. His ground game is really strong.",1],["I am rooting in the ground.",0,"Like a tree? \"Root for\" means support, man!"],["I root for nobody. Fighting is fighting.",0,"Okay… you're no fun."]],why:"root for = 替…加油。underdog = 不被看好的一方。給一個理由會更像內行。",sk:"listen"},
{who:"Jake",en:"No way! The champ has crazy knockout power.",zh:"不可能！衛冕者擊倒力超強。",o:[["True, but if it goes to the ground, I think he'll win by submission.",1],["Yes, champ is power.",0,"Uh… I think you agree with me? Not sure."],["Knockout is bad for health.",0,"Thanks, Doctor Henry."]],why:"True, but… 先認同再提出不同看法，閒聊時最自然。",sk:"speak"},
{who:"Mike",en:"Do you train, or just watch?",zh:"你有在練，還是只看？",o:[["I do boxing three times a week, and I just started some jiu-jitsu.",1],["I watch training.",0,"Watching training is not training, buddy."],["Train? I take the train to work.",0,"Ha! Not that kind of train."]],why:"說明頻率和項目，讓對話繼續：I do boxing three times a week…",sk:"speak"},
{who:"Jake",en:"Wow, did you see that? He tapped out in the second round!",zh:"哇，你有看到嗎？他第二回合拍地認輸了！",o:[["Unbelievable! I told you, that's a perfect submission.",1],["He tapped the floor? Is he okay?",0,"Tapping out means giving up, man. He's fine."],["Second round is before the third round.",0,"…Thanks for the math."]],why:"tap out = 拍地認輸。Unbelievable! I told you… 很自然的激動反應。",sk:"listen"},
{who:"Mike",en:"That was close. I think they need a rematch.",zh:"打得很接近。我覺得他們需要再戰。",o:[["Totally. I'd pay to watch that rematch. Same place next time?",1],["Rematch is match again again.",0,"That's… technically correct, I guess."],["No more fighting, please.",0,"We're at a fight bar, Henry."]],why:"Totally（完全同意）＋提議下次再約，把閒聊變人脈。",sk:"speak"}],
ch:{who:"Jake",en:"So, who's your favorite fighter, and why?",zh:"所以你最喜歡哪個選手？為什麼？",task:"說出你喜歡哪一類型的選手（不用真實人名也可以），給理由，並反問對方。",rules:[["favorite|like|love|fan","表達喜好",20],["because|since","說明理由",25],["ground|striking|knockout|submission|wrestl|box|jiu","格鬥術語",25],["\\?","反問對方",15],["what about you|how about you|who'?s yours|yours","接話反問",15]],sample:"I'm a big fan of grapplers, because I love a good submission more than a knockout. What about you? Who's your favorite?",sampleZh:"我是地板技型選手的粉絲，因為比起 KO，我更愛漂亮的降服。你呢？最喜歡誰？"}},
{line:'life',bg:'bg_gym',title:"生活 10：自我介紹與興趣",story:"在新加坡的國際業務研討會，晚宴上坐了一桌來自各國的陌生人。主持人說：「每個人用一分鐘介紹自己！」輪到你了。",
cards:[["be in charge of","phr.","負責","I'm in charge of overseas sales.","我負責海外業務。"],["based in","phr.","駐在、總部在","I'm based in Taipei.","我駐在台北。"],["in my free time","phr.","閒暇時","In my free time, I go boxing.","閒暇時我去打拳。"],["be into","phr.","熱衷於","I'm really into investing.","我很熱衷投資。"],["What about you?","phr.","那你呢？","I love hiking. What about you?","我愛爬山，你呢？"]],
qs:[{who:"Host",en:"Henry, would you like to introduce yourself?",zh:"Henry，要不要介紹一下自己？",o:[["Sure. Hi everyone, I'm Henry. I'm based in Taipei, and I'm in charge of overseas sales.",1],["I am Henry. That's all.",0,"Short and… mysterious."],["My name is Henry, I was born in 1986, my blood type is A…",0,"We don't need your blood type, Henry!"]],why:"自我介紹三元素：名字＋所在地 based in＋職責 in charge of。",sk:"speak"},
{who:"Priya",en:"What does your company do?",zh:"你們公司做什麼的？",o:[["We make AI inspection systems for factories. Basically, our cameras find defects humans miss.",1],["My company does business.",0,"Well, I'd hope so!"],["Very difficult to explain. Skip.",0,"Try me, I'm smart."]],why:"一句話說公司做什麼，再用 Basically… 白話解釋。",sk:"speak"},
{who:"Priya",en:"What do you like to do in your free time?",zh:"你閒暇時喜歡做什麼？",o:[["I'm really into boxing and fitness. I also follow tech stocks. What about you?",1],["Free time? I have no free time. Only work.",0,"That sounds… sad, honestly."],["I like sleep and eat.",0,"Relatable, but grammar: \"sleeping and eating\"."]],why:"be into = 熱衷。分享兩個興趣後用 What about you? 把話丟回去。",sk:"speak"},
{who:"Lukas",en:"Boxing? Nice! How long have you been doing it?",zh:"拳擊？讚！你練多久了？",o:[["About three years. It helps me manage stress from work.",1],["I am boxing since three years.",0,"Close! \"I've been boxing for three years.\""],["Long. Very long.",0,"How long is \"very long\"?"]],why:"How long have you been…? 問持續時間，回答 About three years 加一句好處。",sk:"listen"},
{who:"Lukas",en:"We should grab a drink later and talk more about investing.",zh:"等等我們該喝一杯，多聊聊投資。",o:[["I'd love that. Let's exchange contacts. Are you on LinkedIn?",1],["Investing is gambling, no thanks.",0,"Okay then… never mind."],["Grab what? Grab who?",0,"\"Grab a drink\" means have a drink!"]],why:"grab a drink = 去喝一杯。順勢交換聯絡方式，社交變人脈。",sk:"listen"}],
ch:{who:"Host",en:"Last one: tell us something interesting about yourself!",zh:"最後一題：說一件關於你的有趣事吧！",task:"用 2–3 句介紹自己：工作、所在地、一個興趣，並反問大家。",rules:[["i'?m henry|my name","說名字",15],["based in|from|live in|taipei|taiwan","所在地",20],["in charge of|work (in|as|for)|sales|company","工作內容",20],["into|enjoy|love|like|free time|box|gym|invest","興趣",25],["what about you|how about you|\\?","反問",20]],sample:"I'm Henry, I'm based in Taipei and I'm in charge of overseas sales. In my free time, I'm really into boxing, and I once sparred with a pro! What about you guys?",sampleZh:"我是 Henry，駐台北，負責海外業務。閒暇時我很熱衷拳擊，還曾經跟職業拳手對練過！你們呢？"}}
);

/* ===== v6：B2–C1 進階章節 ===== */
X.push(
{line:'work',lv:'B2',bg:'bg_negotiation',title:'B2 工作：談判桌上的讓步藝術',story:'年度合約續約，採購主管 Rachel 一開場就說預算被砍了 15%。你要守住利潤，又不能讓關係破裂。',
cards:[["leverage","n.","談判籌碼、影響力","We have more leverage if we commit to volume.","如果我們承諾採購量，就有更多籌碼。"],["bottom line","n.","底線；最終結果","What's your bottom line on price?","你們價格的底線是多少？"],["counteroffer","n.","還價、反提案","We'll come back with a counteroffer tomorrow.","我們明天會提出還價。"],["non-negotiable","adj.","沒有商量餘地的","The delivery date is non-negotiable.","交期沒有商量餘地。"],["win-win","adj.","雙贏的","Let's look for a win-win solution.","我們來找個雙贏方案。"]],
qs:[{who:'Rachel',en:"I'll be frank. Our budget has been cut by fifteen percent this year.",zh:"我就直說了。我們今年預算被砍了 15%。",o:[["I appreciate your honesty. Could you tell me which areas are most affected, so we can look at options together?",1,'',"謝謝你的坦白。可以告訴我哪些部分受影響最大，讓我們一起看看選項嗎？"],["That's your problem, not ours.",0,"Wow. Maybe I should talk to your competitor, then.","那是你們的問題，不是我們的。"],["OK, we will cut fifteen percent too.",0,"That was quick. You didn't even try to negotiate!","好，我們也降 15%。"]],why:"先感謝對方坦白，再用開放式問題了解真正的限制，不要立刻讓步。",sk:'speak'},
{who:'Rachel',en:"Your competitor has offered us a much lower unit price.",zh:"你們的競爭對手給了我們低很多的單價。",o:[["I understand. Before we compare prices, could we compare the total cost, including downtime and support?",1,'',"了解。在比價之前，我們可以比較總成本嗎？包括停機和支援。"],["Their machines are garbage. Everybody knows that.",0,"Careful. Badmouthing competitors makes you look desperate.","他們的機器是垃圾，大家都知道。"],["Then please buy from them.",0,"Are you trying to lose this account?","那請你跟他們買。"]],why:"不攻擊對手，把討論從「單價」拉到「總成本」，這是重新定義談判框架（reframing）。",sk:'speak'},
{who:'Rachel',en:"What's your bottom line?",zh:"你們的底線是多少？",o:[["If you can commit to a three-year contract, we could go down to eight percent. That's as far as we can go.",1,'',"如果你們能簽三年合約，我們可以降到 8%。這是我們最大的讓步。"],["My bottom is very low.",0,"Um… I'm going to pretend I didn't hear that.","（誤用）我的屁股很低。"],["We have no bottom line. Anything is OK.",0,"Great! Then I'll ask for forty percent.","我們沒有底線，什麼都可以。"]],why:"讓步一定要「有條件」：If you can…, we could…。再用 That's as far as we can go 表示到底了。",sk:'speak'},
{who:'Rachel',en:"Free on-site training would really help us justify this internally.",zh:"免費到場訓練能幫我們在內部說服高層。",o:[["That's something we can work with. Training is negotiable, but the payment terms are non-negotiable.",1,'',"這個我們可以配合。訓練可以談，但付款條件沒有商量餘地。"],["Training is free? Everything is free!",0,"Your finance team is going to love you.","訓練免費？全部都免費！"],["Justify? I don't understand this word.",0,"Justify means to give a good reason for something.","Justify？我不懂這個字。"]],why:"清楚區分哪些可以談（negotiable）、哪些不能談（non-negotiable），對方才知道界線。",sk:'speak'},
{who:'Rachel',en:"Eight percent, three years, plus training. I think we can live with that.",zh:"8%、三年、再加訓練。我想我們可以接受。",o:[["Great. I think that's a win-win. I'll send over a summary of what we agreed today.",1,'',"太好了，我認為這是雙贏。我今天會把我們的共識整理寄給你。"],["Finally! You are very difficult.",0,"Glad to hear you enjoyed it too…","終於！你很難搞。"],["Wait, maybe I want to change everything again.",0,"Seriously? We just shook hands!","等等，也許我想全部再改一次。"]],why:"成交後立刻用書面確認共識（send over a summary），避免之後有爭議。",sk:'speak'}],
ch:{who:'Rachel',en:"Give me one good reason not to switch to the cheaper supplier.",zh:"給我一個不換成便宜供應商的好理由。",task:'用「總成本」或「風險」說服對方，並提出有條件的讓步。',rules:[['total cost|long run|downtime|risk','提到總成本／風險',25],['if you|provided that|as long as','有條件的讓步',25],['understand|appreciate|fair','先同理對方',20],['\\d|percent','有具體數字',15],['win-win|both|partner','強調合作關係',15]],sample:"I understand the pressure on your budget. But our machines have forty percent less downtime, so the total cost is lower in the long run. If you can commit to three years, we can add free training.",sampleZh:"我理解你們的預算壓力。但我們的機台停機時間少四成，所以長期總成本更低。如果你們願意簽三年，我們可以加送免費訓練。"}},

{line:'work',lv:'B2',bg:'bg_meeting',title:'B2 工作：會議衝突與意見不合',story:'週會上，工程部的 Kevin 公開說業務部「亂答應客戶交期」。全場安靜，老闆看著你。',
cards:[["with all due respect","phr.","恕我直言（禮貌地表達不同意）","With all due respect, I see it differently.","恕我直言，我的看法不同。"],["take something on board","phr.","把（意見）聽進去、採納","Thanks, I'll take that on board.","謝謝，我會把這點聽進去。"],["common ground","n.","共識、共同點","Let's find some common ground.","我們來找找共識。"],["escalate","v.","（問題）升級、上報","Let's not escalate this yet.","我們先別把事情鬧大。"],["take this offline","phr.","會後私下討論","Can we take this offline?","我們可以會後再私下談嗎？"]],
qs:[{who:'Kevin',en:"Sales keeps promising delivery dates we can't possibly meet.",zh:"業務一直答應我們根本做不到的交期。",o:[["I hear your frustration, Kevin. Can you give me a specific example so we can fix the process?",1,'',"我理解你的挫折，Kevin。可以舉個具體例子，讓我們改善流程嗎？"],["That's a lie. Engineering is just slow.",0,"Okay, now this meeting is getting ugly.","那是謊話，是工程部太慢。"],["Sorry, sorry, it's all my fault.",0,"Taking all the blame won't fix the process either.","對不起對不起，全是我的錯。"]],why:"面對公開指責：先承認情緒（I hear your frustration），再要求具體例子，把衝突轉成解決問題。",sk:'speak'},
{who:'Kevin',en:"The Delta order. You promised four weeks. It takes at least six.",zh:"Delta 那張單。你答應四週，至少要六週。",o:[["With all due respect, the client was told four weeks was our target, not a guarantee. But I take your point on board.",1,'',"恕我直言，我們跟客戶說四週是目標，不是保證。但你的意見我聽進去了。"],["With all respect, you are wrong.",0,"That's not how \"with all due respect\" works. Too blunt!","（太直接）帶著所有尊重，你錯了。"],["Six weeks? Just work overtime.",0,"Tell that to my team. They'll love you.","六週？加班就好了。"]],why:"With all due respect 後面接不同意見，但要有事實支撐，並用 I take your point on board 表示有在聽。",sk:'speak'},
{who:'Boss',en:"Okay, I don't want this to turn into a blame game. What do you two suggest?",zh:"好，我不希望這變成互相指責。你們兩個有什麼建議？",o:[["I think we have common ground: we both want happy clients. Maybe Sales should check with Engineering before quoting dates.",1,'',"我想我們有共識：我們都希望客戶滿意。也許業務報交期前應該先跟工程確認。"],["I suggest Kevin says sorry.",0,"That's not going to help, Henry.","我建議 Kevin 道歉。"],["I suggest we stop talking.",0,"Problem avoided, not solved.","我建議我們別再說了。"]],why:"找共同目標（common ground），再提出具體流程改善，就能把衝突收尾。",sk:'speak'},
{who:'Kevin',en:"Fine, but this happens every month. Maybe we should escalate it to the VP.",zh:"好吧，但每個月都這樣。也許我們該上報給副總。",o:[["I'd rather we try fixing it ourselves first. If it doesn't improve in a month, then let's escalate.",1,'',"我寧願先自己試著解決。如果一個月後沒改善，我們再上報。"],["Yes! Let's tell the VP you are lazy.",0,"Great teamwork, Henry.","好啊！跟副總說你很懶。"],["Escalator? We take the elevator.",0,"Escalate, not escalator!","電扶梯？我們搭電梯。"]],why:"escalate = 把問題往上呈報。I'd rather we… first 是委婉提出另一個做法。",sk:'listen'},
{who:'Boss',en:"We're running out of time.",zh:"我們時間快不夠了。",o:[["Kevin, why don't we take this offline? Let's grab thirty minutes this afternoon to draft a new process.",1,'',"Kevin，我們會後再私下談吧？今天下午找三十分鐘草擬新流程。"],["Wait, I have ten more points.",0,"Everyone just sighed.","等等，我還有十點要說。"],["Okay, we go offline. No internet.",0,"Offline here means talk privately, not turn off Wi-Fi!","好，我們離線，不上網。"]],why:"take this offline = 會後私下討論，避免占用大家的會議時間。",sk:'listen'}],
ch:{who:'Kevin',en:"So what exactly will Sales do differently from now on?",zh:"那業務從現在起到底會有什麼不同？",task:'承認問題，提出一個具體的流程改變，並邀請對方合作。',rules:[['understand|fair|point|agree','承認對方的觀點',20],['check|confirm|ask','提出確認步驟',25],['before|from now on|going forward','說明何時開始',20],['together|both|team|we','強調合作',20],['week|day|\\d','有具體時間',15]],sample:"That's a fair point. Going forward, we'll confirm every delivery date with Engineering before we quote it, ideally within one working day. Let's work on it together.",sampleZh:"你說得有道理。從現在起，我們報交期前都會先跟工程部確認，最好在一個工作天內。我們一起來改善。"}},

{line:'life',lv:'B2',bg:'bg_gym',title:'B2 生活：和教練討論訓練瓶頸',story:'你的臥推卡在 80 公斤三個月了。新教練 Marcus 是前職業運動員，說話直接。',
cards:[["plateau","n./v.","停滯期；進入停滯","I've hit a plateau on my bench press.","我的臥推進入停滯期了。"],["progressive overload","n.","漸進式超負荷","Progressive overload is the key to getting stronger.","漸進式超負荷是變強的關鍵。"],["recovery","n.","恢復","Sleep is the most important part of recovery.","睡眠是恢復最重要的部分。"],["push through","phr.","硬撐過去、咬牙撐住","Don't push through sharp pain.","尖銳的疼痛不要硬撐。"],["cut back on","phr.","減少","You should cut back on sugar.","你應該少吃糖。"]],
qs:[{who:'Marcus',en:"So what's going on with your training?",zh:"你的訓練怎麼了？",o:[["I've hit a plateau. My bench has been stuck at eighty kilos for three months.",1,'',"我遇到停滯期了。臥推卡在 80 公斤三個月。"],["I am plateau. Eighty kilo stuck.",0,"I think you mean you've HIT a plateau.","（文法錯誤）我是停滯。80 公斤卡住。"],["Everything is perfect. I'm the strongest.",0,"Then why did you hire me?","一切都很完美，我最強。"]],why:"hit a plateau = 遇到停滯期。has been stuck for… 用現在完成進行式描述持續的狀態。",sk:'speak'},
{who:'Marcus',en:"How are you sleeping? And how many days a week do you train chest?",zh:"你睡得怎樣？一週練幾天胸？",o:[["Honestly, only about six hours. And I train chest four times a week, which might be too much.",1,'',"老實說只睡大概六小時。我一週練胸四次，可能太多了。"],["I sleep in the gym.",0,"Please don't.","我睡在健身房。"],["Chest every day. More is better!",0,"That's probably why you're stuck.","每天練胸。越多越好！"]],why:"which might be too much 用 might 表達自己的推測，是 B2 常見的 hedging（委婉語氣）。",sk:'speak'},
{who:'Marcus',en:"Your problem isn't effort. It's recovery. You need to train smarter, not harder.",zh:"你的問題不是不努力，而是恢復。你要練得更聰明，不是更拚。",o:[["That makes sense. So should I cut back on chest days and focus on sleep?",1,'',"有道理。所以我該減少練胸的天數，專心睡好嗎？"],["No, I will train harder. No pain, no gain!",0,"That mindset is exactly what got you stuck.","不，我要練更拚。沒有痛就沒有收穫！"],["Smarter? Are you saying I'm stupid?",0,"Relax, it's an expression!","更聰明？你是說我笨嗎？"]],why:"train smarter, not harder 是常見說法。cut back on = 減少。",sk:'listen'},
{who:'Marcus',en:"Also, add two and a half kilos every two weeks. That's progressive overload.",zh:"還有，每兩週加 2.5 公斤。這就是漸進式超負荷。",o:[["Got it. Small, steady increases instead of trying to max out every session.",1,'',"了解。小幅穩定增加，而不是每次都試極限。"],["Two and a half? That's too easy. I'll add twenty.",0,"And then you'll get injured. Great plan.","2.5？太簡單了，我加 20。"],["Overload? My phone is overloaded too.",0,"Different overload, buddy.","超負荷？我手機也超載了。"]],why:"max out = 挑戰最大重量。instead of… 對比兩種做法。",sk:'speak'},
{who:'Marcus',en:"If your shoulder hurts, what do you do?",zh:"如果肩膀痛，你會怎麼做？",o:[["Stop and tell you. I shouldn't push through sharp pain.",1,'',"停下來告訴你。尖銳的痛我不該硬撐。"],["Push through it like a warrior!",0,"Warriors with torn rotator cuffs don't fight.","像戰士一樣撐過去！"],["Take ten painkillers.",0,"Please never do that.","吃十顆止痛藥。"]],why:"push through = 硬撐過去。訓練時尖銳疼痛不要硬撐。",sk:'listen'}],
ch:{who:'Marcus',en:"Tell me your plan for the next month in a few sentences.",zh:"用幾句話告訴我你下個月的計畫。",task:'說出訓練頻率、恢復（睡眠）和漸進增加重量的計畫。',rules:[['sleep|rest|recover','提到恢復',25],['times a week|days a week|twice|three','訓練頻率',20],['add|increase|kilo|kg','漸進增加',25],['cut back|reduce|less','減少某事',15],['will|going to|plan','用未來式',15]],sample:"I'm going to train chest twice a week instead of four times, and sleep at least seven hours. I'll add two and a half kilos every two weeks and cut back on late-night snacks.",sampleZh:"我會把練胸從一週四次改成兩次，至少睡七小時。每兩週加 2.5 公斤，並減少宵夜。"}},

{line:'life',lv:'B2',bg:'bg_bar',title:'B2 生活：和朋友聊科技新聞',story:'週五晚上，矽谷來的朋友 Jason 拿著手機說：「你看到那家 AI 公司的新聞了嗎？」',
cards:[["game changer","n.","改變遊戲規則的事物","This chip could be a game changer.","這顆晶片可能改變遊戲規則。"],["overhyped","adj.","被過度炒作的","I think VR is a bit overhyped.","我覺得 VR 有點被過度炒作。"],["privacy concern","n.","隱私疑慮","There are serious privacy concerns.","有嚴重的隱私疑慮。"],["keep up with","phr.","跟上","It's hard to keep up with AI news.","要跟上 AI 新聞很難。"],["remains to be seen","phr.","還有待觀察","Whether it works remains to be seen.","它是否有效還有待觀察。"]],
qs:[{who:'Jason',en:"Did you see they launched an AI that can book your whole trip?",zh:"你看到他們推出一個能幫你訂整趟旅行的 AI 嗎？",o:[["I did! It could be a game changer, but I'm a bit worried about privacy.",1,'',"有！它可能改變遊戲規則，但我有點擔心隱私。"],["Game? I don't play games.",0,"Game changer, not game player!","遊戲？我不玩遊戲。"],["AI will kill us all. Run.",0,"Okay, doomsday guy.","AI 會殺光我們。快逃。"]],why:"表達看法時「肯定＋保留」：It could be…, but I'm a bit worried about… 聽起來成熟。",sk:'speak'},
{who:'Jason',en:"Honestly, I think it's overhyped. Remember the metaverse?",zh:"老實說，我覺得被過度炒作了。記得元宇宙嗎？",o:[["Fair point. But unlike the metaverse, people are actually using AI at work every day.",1,'',"有道理。但跟元宇宙不同，大家每天真的在工作上用 AI。"],["Yes, metaverse is my best friend.",0,"Uh… okay?","對，元宇宙是我最好的朋友。"],["Overhyped means very good, right?",0,"Nope, it means people exaggerate how good it is.","Overhyped 意思是很好，對吧？"]],why:"Fair point. But unlike…, … 先承認對方，再用對比提出不同意見。",sk:'speak'},
{who:'Jason',en:"How do you even keep up with all this news?",zh:"你怎麼跟得上這麼多新聞？",o:[["I follow a few newsletters and podcasts. Otherwise, it's impossible to keep up.",1,'',"我追蹤幾個電子報和 Podcast。不然根本跟不上。"],["I keep up at six a.m.",0,"I think you mean you wake up at six.","我六點跟上。"],["I don't keep. I throw.",0,"Ha, that's not what it means.","我不保留，我丟掉。"]],why:"keep up with = 跟上（進度、新聞）。",sk:'listen'},
{who:'Jason',en:"Do you think it'll replace travel agents?",zh:"你覺得它會取代旅行社嗎？",o:[["Maybe for simple trips. For complicated ones, it remains to be seen.",1,'',"簡單的行程也許會。複雜的行程就還有待觀察。"],["Yes, 100%, tomorrow.",0,"Wow, very confident prediction.","會，百分之百，明天就會。"],["Travel agents are robots already.",0,"Not yet, I promise.","旅行社已經是機器人了。"]],why:"remains to be seen = 還有待觀察。預測時不要說死，C1 程度很重視這種保留語氣。",sk:'speak'},
{who:'Jason',en:"Would you trust it with your credit card?",zh:"你會放心把信用卡交給它嗎？",o:[["Only if it asks me to confirm before paying. I'd want the final say.",1,'',"只有它付款前先問我確認才行。我希望最後由我決定。"],["Sure, take all my money.",0,"Bold strategy.","當然，把我的錢都拿走。"],["My card is under my bed.",0,"That's… not the point.","我的卡在床底下。"]],why:"Only if… 表示條件。have the final say = 有最後決定權。",sk:'speak'}],
ch:{who:'Jason',en:"So overall, is this AI news good or bad for normal people?",zh:"所以整體來說，這個 AI 新聞對一般人是好是壞？",task:'給一個平衡的看法：一個好處＋一個疑慮，並用委婉語氣。',rules:[['save|time|convenient|easier|faster|benefit','提到好處',25],['privacy|risk|concern|worried|mistake','提到疑慮',25],['but|however|on the other hand','有轉折',20],['might|could|maybe|probably|remains to be seen','用委婉語氣',20],['i think|in my opinion|personally','表達個人看法',10]],sample:"Personally, I think it's mostly good because it could save people a lot of time. On the other hand, there are privacy concerns, so I'd still want to confirm every payment myself.",sampleZh:"我個人認為大致是好的，因為可以幫大家省很多時間。另一方面，有隱私疑慮，所以我還是想自己確認每筆付款。"}},

{line:'work',lv:'B2',bg:'bg_email',title:'B2 工作：寫一封有說服力的 Email',story:'你想說服德國客戶 Klaus 把試用期延長兩週，但他上週才抱怨你們回覆太慢。Email 要寫得專業又不卑微。',
cards:[["I'm writing to","phr.","（Email 開頭）來信是為了…","I'm writing to follow up on our call.","來信是想跟進我們的通話。"],["I'd like to propose","phr.","我想提議","I'd like to propose a two-week extension.","我想提議延長兩週。"],["in light of","phr.","鑒於、考慮到","In light of the delay, we will waive the fee.","鑒於延誤，我們會免收費用。"],["would you be open to","phr.","你是否願意考慮","Would you be open to a short call?","你願意考慮簡短通個電話嗎？"],["look forward to hearing from you","phr.","期待您的回覆","I look forward to hearing from you.","期待您的回覆。"]],
qs:[{who:'Klaus',en:"(Email) Your team took three days to answer my last question. This is not acceptable.",zh:"（Email）你們團隊花了三天才回答我上個問題。這無法接受。",o:[["Dear Klaus, thank you for your feedback, and I apologize for the slow response. You're right to expect better.",1,'',"親愛的 Klaus，謝謝你的回饋，並為回覆太慢道歉。你理應得到更好的服務。"],["Hi Klaus, we were busy. Sorry not sorry.",0,"I'm forwarding this to your boss.","嗨 Klaus，我們很忙。抱歉但不後悔。"],["Klaus, three days is normal in Taiwan.",0,"Then maybe I need a supplier outside Taiwan.","Klaus，三天在台灣很正常。"]],why:"抱怨信回覆：感謝回饋＋道歉＋承認對方的期待合理，不找藉口。",sk:'speak'},
{who:'Klaus',en:"(Email) What are you going to do about it?",zh:"（Email）你們打算怎麼處理？",o:[["Going forward, you'll have a dedicated contact, and we'll reply within one business day.",1,'',"從現在起，你會有專屬窗口，我們會在一個工作天內回覆。"],["We will try our best maybe.",0,"\"Maybe\" is not a plan.","我們也許會盡力。"],["Please don't ask so many questions.",0,"I ask questions because I pay you.","請不要問這麼多問題。"]],why:"給具體承諾：dedicated contact（專屬窗口）＋明確時間 within one business day。",sk:'speak'},
{who:'Klaus',en:"(Email) Fine. Was there anything else?",zh:"（Email）好。還有其他事嗎？",o:[["Yes. In light of the delay, I'd like to propose extending your trial by two weeks at no extra cost.",1,'',"有。鑒於這次延誤，我想提議免費延長你們的試用期兩週。"],["Yes. Give us more time, please, please.",0,"Begging isn't very convincing.","有。請多給我們時間，拜託拜託。"],["Also, you must buy now.",0,"Pressure after an apology? Interesting choice.","還有，你們必須現在買。"]],why:"In light of… 把延誤轉成提議的理由；I'd like to propose 是正式又不卑微的提案句型。",sk:'speak'},
{who:'Klaus',en:"(Email) Two more weeks? What's in it for us?",zh:"（Email）再兩週？對我們有什麼好處？",o:[["It gives your team time to test the system on your real production line, so you can make the decision based on solid data.",1,'',"讓你們團隊有時間在真正的產線上測試系統，就能根據可靠的數據做決定。"],["It's good for us, so it's good for you.",0,"That logic doesn't work on me.","對我們好，所以對你們也好。"],["Nothing, but please say yes.",0,"Thanks for your honesty, I guess.","沒什麼好處，但請答應。"]],why:"說服重點是「對方的好處」：based on solid data（根據可靠數據）。",sk:'speak'},
{who:'Klaus',en:"(Email) I'll think about it.",zh:"（Email）我會考慮。",o:[["Thank you. Would you be open to a fifteen-minute call on Thursday? I look forward to hearing from you.",1,'',"謝謝。你願意週四通個十五分鐘的電話嗎？期待你的回覆。"],["Think fast, please. Offer ends today!",0,"Sounds like a TV commercial.","請快點想，優惠今天結束！"],["OK. Bye bye. Love, Henry.",0,"Love? We're not that close.","好，掰掰。愛你的 Henry。"]],why:"結尾給一個具體的下一步（a call on Thursday），再用 I look forward to hearing from you 收尾。",sk:'speak'}],
ch:{who:'Klaus',en:"Write the main paragraph of your email asking for the two-week extension.",zh:"寫出 Email 主要段落，請求延長兩週試用。",task:'用正式語氣：提議＋理由（對方的好處）＋具體下一步。',rules:[["propose|suggest|would like to",'正式提議',25],['two weeks|2 weeks|extend|extension','說出延長',20],['data|test|production|decision|benefit','對方的好處',25],['would you|could we|open to','禮貌詢問',15],['look forward|thank','禮貌結尾',15]],sample:"In light of last week's delay, I'd like to propose extending your trial by two weeks at no extra cost. This would allow your team to test the system on your real production line and decide based on solid data. Would you be open to a short call on Thursday? I look forward to hearing from you.",sampleZh:"鑒於上週的延誤，我想提議免費延長試用兩週，讓你們團隊在真正的產線上測試，根據可靠數據做決定。你願意週四簡短通個電話嗎？期待你的回覆。"}},

{line:'life',lv:'B2',bg:'bg_boxing',title:'B2 生活：UFC 賽事賽後分析',story:'UFC 主賽剛結束，你在運動酒吧和兩個美國人 Tyler、Mia 熱烈討論那場意外的判定。',
cards:[["split decision","n.","（裁判）分歧判定","He won by split decision.","他以分歧判定獲勝。"],["robbery","n.","（比賽）判決不公、被搶走勝利","That decision was a robbery!","那個判決根本是搶劫！"],["game plan","n.","作戰計畫","His game plan was to keep it standing.","他的作戰計畫是保持站立打擊。"],["gas out","phr.","體力耗盡","He gassed out in the third round.","他第三回合體力耗盡。"],["give credit where it's due","phr.","該給的肯定要給","Give credit where it's due, he was smart.","該給的肯定要給，他很聰明。"]],
qs:[{who:'Tyler',en:"Split decision? That was a total robbery!",zh:"分歧判定？根本是搶劫！",o:[["I get why you're upset, but I actually think the judges got it right. He won two of the three rounds.",1,'',"我懂你為什麼不爽，但我其實覺得裁判判得對。他贏了三回合中的兩回合。"],["Robbery? Call the police!",0,"Not that kind of robbery, man.","搶劫？快報警！"],["Judges are always stupid.",0,"Easy to say, harder to prove.","裁判總是很蠢。"]],why:"robbery 在運動中指「判決不公」。不同意時先同理（I get why you're upset），再給理由。",sk:'speak'},
{who:'Mia',en:"But he was dominating in the first round!",zh:"但他第一回合完全壓制！",o:[["True, but he gassed out after that. His cardio just wasn't there.",1,'',"沒錯，但之後他就沒體力了。他的心肺就是不夠。"],["Yes, first round is the only round.",0,"There are three rounds, Henry.","對，第一回合是唯一的回合。"],["He drank gas? Dangerous!",0,"Gassed OUT means he got tired, haha.","他喝汽油？太危險了！"]],why:"gas out = 體力耗盡。True, but… 是很自然的口語反駁。",sk:'speak'},
{who:'Tyler',en:"Okay, but what was the other guy's game plan? He barely threw anything.",zh:"好吧，但另一個人的作戰計畫是什麼？他幾乎沒出拳。",o:[["I think his plan was to survive early, let him burn out, then take over late. Give credit where it's due, it worked.",1,'',"我想他的計畫是前期撐住，讓對手燒完體力，後段再接管。該給的肯定要給，這招有效。"],["His plan was to sleep.",0,"Ha, it did look like that in round one.","他的計畫是睡覺。"],["He has no plan. He has no brain.",0,"Harsh, but he still won.","他沒有計畫，也沒腦子。"]],why:"Give credit where it's due = 該給的肯定要給，承認對方表現好時很實用。",sk:'speak'},
{who:'Mia',en:"Would you want to see a rematch?",zh:"你想看復仇戰嗎？",o:[["Definitely. If the first guy works on his cardio, it could go either way.",1,'',"當然。如果第一個人加強心肺，勝負就很難說了。"],["Rematch is boring. Same people.",0,"That's kind of the point of a rematch.","復仇戰很無聊，一樣的人。"],["I want to fight them both.",0,"Calm down, champ.","我想跟他們兩個打。"]],why:"it could go either way = 勝負難料。用 if 句型做假設預測。",sk:'speak'},
{who:'Tyler',en:"Who's your pick for the title fight next month?",zh:"下個月的冠軍戰你看好誰？",o:[["I'm leaning towards the challenger. He's younger and his wrestling has improved a lot.",1,'',"我比較傾向挑戰者。他比較年輕，摔跤進步很多。"],["I pick my nose.",0,"Gross, and not what I asked.","我挖鼻孔。"],["The one who wins.",0,"Thanks, very helpful.","會贏的那個。"]],why:"I'm leaning towards… = 我傾向於…，比 I choose 更自然、帶保留。",sk:'speak'}],
ch:{who:'Mia',en:"Break it down for me. Why did the underdog win?",zh:"幫我分析一下。冷門選手為什麼會贏？",task:'用兩三句分析：作戰計畫、體能、關鍵回合。',rules:[['game plan|plan|strategy','提到作戰計畫',25],['cardio|gas|tired|energy','提到體能',25],['round','提到回合',15],['because|so|which','有因果',20],['credit|smart|disciplined','給出肯定',15]],sample:"Give credit where it's due, his game plan was smart. He stayed calm in the first round, and because his opponent gassed out, he took over in rounds two and three.",sampleZh:"該給的肯定要給，他的作戰計畫很聰明。第一回合保持冷靜，因為對手體力耗盡，他在第二、三回合接管比賽。"}},

{line:'work',lv:'B2',bg:'bg_meeting',title:'B2 工作：年度績效面談',story:'年底了，你的主管 Grace 要和你做績效面談。今年業績達標，但你知道有兩個案子處理得不好。',
cards:[["exceed expectations","phr.","超出預期","Your sales exceeded expectations.","你的業績超出預期。"],["area for improvement","n.","待改進的地方","Time management is an area for improvement.","時間管理是待改進的地方。"],["constructive feedback","n.","建設性的回饋","Thanks for the constructive feedback.","謝謝你建設性的回饋。"],["take ownership","phr.","承擔責任、主動負責","I want to take ownership of the project.","我想主動負責這個專案。"],["career path","n.","職涯發展路徑","Let's talk about your career path.","我們來談談你的職涯發展。"]],
qs:[{who:'Grace',en:"Overall, your numbers exceeded expectations this year. Well done.",zh:"整體來說，你今年的數字超出預期。做得好。",o:[["Thank you, I really appreciate that. The team helped a lot, especially on the Delta account.",1,'',"謝謝，我很感激。團隊幫了很多，尤其是 Delta 那個客戶。"],["I know. I'm the best.",0,"Confidence is good. Arrogance, less so.","我知道，我最強。"],["Really? I think you are lying.",0,"Why would I lie in your review?","真的嗎？我覺得你在說謊。"]],why:"接受讚美：謝謝＋把功勞分給團隊，顯得成熟。",sk:'speak'},
{who:'Grace',en:"That said, I'd like to talk about the Orion project. The client wasn't happy.",zh:"話雖如此，我想談談 Orion 專案。客戶不太滿意。",o:[["You're right. I take ownership of that. I should have updated them more often.",1,'',"你說得對，那是我的責任。我應該更常更新進度給他們。"],["Orion was the engineer's fault.",0,"Blaming others won't look good in your review.","Orion 是工程師的錯。"],["The client is too sensitive.",0,"The client pays our salaries, Henry.","客戶太敏感了。"]],why:"take ownership = 承擔責任。should have + p.p. 表示「當初應該…」。",sk:'speak'},
{who:'Grace',en:"I'd say communication is your main area for improvement.",zh:"我認為溝通是你主要待改進的地方。",o:[["That's constructive feedback. Could you suggest one or two things I could do differently?",1,'',"這是很有建設性的回饋。你可以建議一兩件我能改變的做法嗎？"],["My communication is perfect. You don't understand me.",0,"…Which kind of proves my point.","我的溝通很完美，是你不懂我。"],["Okay, I will stop talking.",0,"That's the opposite of what I meant.","好，我不說話了。"]],why:"接受批評：感謝回饋＋請對方給具體建議。",sk:'speak'},
{who:'Grace',en:"Where do you see yourself in two or three years?",zh:"你覺得兩三年後的自己在哪裡？",o:[["I'd like to move into a regional sales manager role, ideally leading a small team in Southeast Asia.",1,'',"我想升到區域業務經理，最好能在東南亞帶一個小團隊。"],["In your chair.",0,"Ha… I'll pretend that's a joke.","坐在你的位子上。"],["At home, rich, no work.",0,"Wouldn't we all…","在家，很有錢，不用工作。"]],why:"談職涯：具體角色＋範圍。ideally 讓語氣不會太強硬。",sk:'speak'},
{who:'Grace',en:"What support do you need from me to get there?",zh:"你需要我提供什麼支持才能達到？",o:[["It would be great if I could join the leadership training next spring, and maybe mentor a junior colleague.",1,'',"如果我能參加明年春天的領導力訓練，也許再帶一位資淺同事，那就太好了。"],["More money. That's all.",0,"Let's talk about development first.","更多錢，就這樣。"],["Nothing. I'm already perfect.",0,"We just discussed that you're not.","不用，我已經很完美了。"]],why:"It would be great if I could… 是委婉提出需求的好句型。",sk:'speak'}],
ch:{who:'Grace',en:"Summarize your goals for next year in two or three sentences.",zh:"用兩三句話總結你明年的目標。",task:'包含一個業績目標、一個改進點、一個職涯發展需求。',rules:[['\\d|percent|target|revenue','業績目標',25],['communicat|update|improve','改進點',25],['training|lead|manager|mentor','職涯發展',20],['will|plan|aim|goal','未來式／目標',15],['support|help|would be great','提出需求',15]],sample:"Next year, I aim to grow my accounts by fifteen percent. I'll improve my communication by sending clients a weekly update. It would be great if I could join the leadership training to prepare for a manager role.",sampleZh:"明年我的目標是讓負責的客戶成長 15%。我會每週寄更新給客戶來改善溝通。如果能參加領導力訓練、為經理職做準備就太好了。"}},

{line:'life',lv:'B2',bg:'bg_pharmacy',title:'B2 生活：看醫生說清楚症狀',story:'出差第二週，你的下背痛到彎腰都困難。飯店幫你約了當地診所的 Dr. Patel。',
cards:[["lower back","n.","下背部","I've had lower back pain for a week.","我下背痛一週了。"],["sharp pain","n.","刺痛、尖銳的痛","It's a sharp pain when I bend over.","我彎腰時是刺痛。"],["flare up","phr.","（病痛）突然發作、加劇","It flares up after long flights.","長途飛行後就會發作。"],["on a scale of one to ten","phr.","以 1 到 10 分來說","On a scale of one to ten, it's a seven.","以 1 到 10 分來說是 7 分。"],["referral","n.","轉診","Can I get a referral to a specialist?","可以轉診給專科醫師嗎？"]],
qs:[{who:'Dr. Patel',en:"What brings you in today?",zh:"今天哪裡不舒服？",o:[["I've had lower back pain for about a week, and it's getting worse.",1,'',"我下背痛大約一週了，而且越來越嚴重。"],["A taxi brought me.",0,"Ha, I meant what's the problem!","計程車載我來的。"],["Back. Pain. Bad.",0,"Can you give me a bit more detail?","背。痛。很糟。"]],why:"What brings you in? = 你為什麼來看診。用現在完成式 I've had… for… 描述持續多久。",sk:'listen'},
{who:'Dr. Patel',en:"Can you describe the pain? Is it dull or sharp?",zh:"可以描述一下疼痛嗎？是悶痛還是刺痛？",o:[["It's mostly a dull ache, but I get a sharp pain when I bend over or lift something.",1,'',"大多是悶痛，但彎腰或提東西時會刺痛。"],["It's very painful pain.",0,"That doesn't tell me much.","（贅字）是很痛的痛。"],["Sharp like a knife. I am dying.",0,"Let's not panic just yet.","像刀一樣利。我快死了。"]],why:"dull ache（悶痛）vs. sharp pain（刺痛），描述觸發時機 when I…。",sk:'speak'},
{who:'Dr. Patel',en:"On a scale of one to ten, how bad is it?",zh:"以 1 到 10 分來說，有多痛？",o:[["Usually around a four, but it flares up to a seven after long flights.",1,'',"平常大約 4 分，但長途飛行後會加劇到 7 分。"],["Ten. No, eleven.",0,"If it were eleven, you'd be in the ER.","10 分。不，11 分。"],["I don't like numbers.",0,"Just give me your best guess.","我不喜歡數字。"]],why:"flare up = 突然加劇。給醫生具體數字和觸發因素最有幫助。",sk:'speak'},
{who:'Dr. Patel',en:"Have you had any numbness or tingling in your legs?",zh:"腿有麻或刺刺的感覺嗎？",o:[["No, nothing like that. It's only in my lower back.",1,'',"沒有，沒有那種感覺。只有下背痛。"],["Yes, I have tingling news.",0,"I think you misheard me.","對，我有刺激的新聞。"],["What is numbers in legs?",0,"Numbness means you can't feel anything.","腿裡的數字是什麼？"]],why:"numbness = 麻木；tingling = 刺麻感。這是醫生常問的警訊題。",sk:'listen'},
{who:'Dr. Patel',en:"It sounds like a muscle strain. Rest, ice, and avoid heavy lifting for two weeks.",zh:"聽起來是肌肉拉傷。休息、冰敷，兩週內避免提重物。",o:[["Understood. If it doesn't improve, could I get a referral to a physiotherapist?",1,'',"了解。如果沒改善，可以轉診給物理治療師嗎？"],["Two weeks no gym? Impossible.",0,"Your back says otherwise.","兩週不能上健身房？不可能。"],["Ice? I'll put ice in my drink.",0,"On your back, please.","冰？我會在飲料裡加冰。"]],why:"referral = 轉診。If it doesn't improve… 先預留下一步。",sk:'speak'}],
ch:{who:'Dr. Patel',en:"Before you go, describe your symptoms once more so I can write them down.",zh:"離開前再描述一次症狀，讓我記下來。",task:'說出部位、多久了、痛的類型、分數、什麼情況會加劇。',rules:[['back','說出部位',20],['week|day|since','多久了',20],['dull|sharp|ache','痛的類型',20],['scale|\\d|four|seven|five|six','給分數',20],['when|after|flare','觸發情況',20]],sample:"I've had lower back pain for about a week. It's mostly a dull ache, around four out of ten, but it becomes a sharp pain when I bend over, and it flares up after long flights.",sampleZh:"我下背痛約一週。大多是悶痛，約 4 分，但彎腰時會刺痛，長途飛行後會加劇。"}},

{line:'work',lv:'C1',bg:'bg_demo',title:'C1 工作：主持法說會（Earnings Call）',story:'公司第一次用英文開法說會。CFO 臨時請假，由你回答分析師 Daniel Wu 的尖銳提問。每個字都會被寫進報告。',
cards:[["guidance","n.","（財測）財務指引","We're reaffirming our full-year guidance.","我們重申全年財測。"],["headwind","n.","逆風、不利因素","Currency was a headwind this quarter.","匯率是本季的不利因素。"],["margin compression","n.","利潤率壓縮","We saw some margin compression in Q3.","第三季利潤率有所壓縮。"],["going forward","phr.","未來、往後","Going forward, we expect demand to recover.","往後我們預期需求會回升。"],["I'd rather not speculate","phr.","我不便臆測","I'd rather not speculate on that.","這點我不便臆測。"]],
qs:[{who:'Daniel',en:"Gross margin fell two points quarter over quarter. What drove that?",zh:"毛利率季減兩個百分點。原因是什麼？",o:[["Two main factors: a stronger Taiwan dollar was a headwind, and we absorbed some higher component costs. We expect both to ease going forward.",1,'',"兩個主要因素：新台幣走強是逆風，我們也吸收了部分零件漲價。我們預期兩者未來都會緩解。"],["Margins go up and down. That's business.",0,"That's not an answer investors will accept.","利潤率有起有落，這就是生意。"],["It fell because it went down.",0,"Circular reasoning on an earnings call? Ouch.","它下降是因為它降了。"]],why:"法說會回答結構：先說「幾個因素」，逐點說明，再給展望（going forward）。headwind = 不利因素。",sk:'speak'},
{who:'Daniel',en:"Are you lowering your full-year guidance?",zh:"你們會下修全年財測嗎？",o:[["No, we're reaffirming our guidance. Our order backlog gives us good visibility into the second half.",1,'',"不會，我們重申財測。我們的未交訂單讓我們對下半年有不錯的能見度。"],["Maybe. I don't know. Let's see.",0,"The stock just dropped five percent.","也許吧。我不知道。再看看。"],["Guidance? We don't need guidance. We know the way.",0,"Financial guidance, not directions!","指引？我們不需要指引，我們認得路。"]],why:"reaffirm guidance = 重申財測；visibility = 能見度。用事實（backlog）支撐信心。",sk:'speak'},
{who:'Daniel',en:"There are rumors you're in talks to acquire a Japanese competitor. Can you comment?",zh:"有傳言說你們正洽談收購一家日本競爭對手。可以評論嗎？",o:[["As a matter of policy, we don't comment on market rumors, and I'd rather not speculate.",1,'',"依照公司政策，我們不評論市場傳言，我也不便臆測。"],["Yes! It's a secret, but we're buying them next month.",0,"And that's how you get a call from the regulator.","對！這是秘密，但我們下個月要買。"],["Who told you? Was it Kevin?",0,"That basically confirms it, Henry.","誰告訴你的？是 Kevin 嗎？"]],why:"法說會的標準迴避：As a matter of policy, we don't comment on… 不洩漏資訊又不失禮。",sk:'speak'},
